<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SONG FOR LIFE - Live Audition Prototype v5</title>
<style>
:root{
  --bg:#090d1a;
  --panel:rgba(12,17,32,.74);
  --panel2:rgba(20,25,46,.72);
  --text:#f7f8ff;
  --muted:#aeb9d0;
  --line:rgba(255,255,255,.15);
  --accent:#ff5ca8;
  --cyan:#68dfff;
  --gold:#ffd56a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#060910;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overscroll-behavior:none;
  touch-action:none;
  overflow:hidden;
}
button{font:inherit}
#app{
  width:100%;height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  background:
    radial-gradient(circle at 50% 10%,rgba(101,73,190,.35),transparent 35%),
    linear-gradient(180deg,#0b1020 0,#080b14 100%);
  padding:
    max(8px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(8px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
  gap:7px;
}

/* Top HUD */
#top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:stretch;
}
.hud{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
#stageInfo{padding:9px 11px}
#stageInfo .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#turnLabel{font-weight:800;font-size:17px;letter-spacing:.03em}
#themeName{font-weight:700;font-size:14px;margin-top:3px}
#themeDesc{color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timerBox{
  width:72px;padding:7px 7px;text-align:center;
  display:flex;flex-direction:column;justify-content:center
}
#timerBox small{color:var(--muted);font-size:10px}
#countdown{font-size:38px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;margin-top:1px}

/* Main live viewport */
#game{
  position:relative;min-height:0;
  overflow:hidden;border-radius:22px;
  border:1px solid var(--line);
  background:
    radial-gradient(ellipse at 50% 75%,rgba(123,71,255,.40),transparent 28%),
    radial-gradient(circle at 50% 10%,rgba(66,148,255,.16),transparent 30%),
    linear-gradient(180deg,#111839 0,#16183c 32%,#080c18 100%);
}
#game:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(105deg,transparent 0 20%,rgba(111,162,255,.10) 21% 22%,transparent 23% 60%,rgba(255,92,168,.10) 61% 62%,transparent 63%),
    repeating-radial-gradient(ellipse at 50% 93%,transparent 0 27px,rgba(125,105,255,.12) 28px 29px);
}
#audienceGlow{
  position:absolute;left:0;right:0;bottom:0;height:27%;
  opacity:.9;
  background:
    radial-gradient(circle at 8% 50%,#ff64be 0 2px,transparent 3px),
    radial-gradient(circle at 18% 64%,#75dfff 0 2px,transparent 3px),
    radial-gradient(circle at 30% 40%,#b68cff 0 2px,transparent 3px),
    radial-gradient(circle at 43% 71%,#ffd56a 0 2px,transparent 3px),
    radial-gradient(circle at 56% 47%,#ff64be 0 2px,transparent 3px),
    radial-gradient(circle at 70% 70%,#75dfff 0 2px,transparent 3px),
    radial-gradient(circle at 83% 45%,#b68cff 0 2px,transparent 3px),
    radial-gradient(circle at 94% 62%,#ffd56a 0 2px,transparent 3px);
  background-size:64px 46px,70px 52px,65px 48px,72px 54px,67px 48px,68px 52px,66px 50px,70px 48px;
}
#platform{
  position:absolute;left:8%;right:8%;bottom:3%;height:31%;
  border-radius:50%;
  background:radial-gradient(ellipse,#2e2467 0,#181a43 52%,#0d1020 74%);
  border:2px solid rgba(153,116,255,.48);
  box-shadow:inset 0 0 35px rgba(89,189,255,.10),0 0 30px rgba(121,77,255,.23);
}
#idol{
  position:absolute;left:50%;bottom:12%;
  width:68px;height:158px;transform:translateX(-50%);
  z-index:4;pointer-events:none;
}
#idol .head{position:absolute;left:18px;top:0;width:36px;height:43px;border-radius:50%;background:linear-gradient(#f2eaff,#c4a9e5)}
#idol .hair{position:absolute;left:3px;top:15px;width:64px;height:94px;border-radius:45% 45% 55% 55%;background:linear-gradient(180deg,#c9b2f1,#7460aa);z-index:-1}
#idol .body{position:absolute;left:11px;top:41px;width:49px;height:68px;border-radius:44% 44% 22% 22%;background:linear-gradient(180deg,#f8f2ff,#2f294d 75%)}
#idol .skirt{position:absolute;left:1px;top:95px;width:69px;height:44px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:linear-gradient(180deg,#fff,#947bd0 65%,#292047)}
#idol .leg{position:absolute;top:136px;width:9px;height:28px;background:#decff0;border-radius:6px}
#idol .l1{left:23px;transform:rotate(5deg)}#idol .l2{right:23px;transform:rotate(-5deg)}
#idol .arm{position:absolute;top:57px;left:48px;width:44px;height:8px;border-radius:8px;background:#e5d4f5;transform:rotate(-23deg);transform-origin:left center}
#idol .mic{position:absolute;left:87px;top:45px;width:4px;height:27px;background:#e6e9f4;transform:rotate(-23deg)}

#nodeLayer,#lineLayer{position:absolute;inset:0;z-index:10}
#lineLayer{pointer-events:none}
.node{
  position:absolute;
  width:76px;height:76px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.72);
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.24),rgba(11,16,32,.60));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;
  color:#fff;user-select:none;touch-action:none;
  box-shadow:0 0 18px currentColor,inset 0 0 20px rgba(255,255,255,.10);
}
.node .icon{font-size:25px;line-height:1;margin-bottom:2px}
.node small{font-size:8px;letter-spacing:.04em;opacity:.82}
.node.vocal{color:#65d9ff}
.node.expression{color:#ff6fbd}
.node.dance{color:#ffd56c}
.node.control{color:#83f3ad}
.node.resonance{color:#c09cff}
.node.sel{
  transform:translate(-50%,-50%) scale(1.12);
  box-shadow:0 0 28px currentColor,0 0 52px currentColor,inset 0 0 22px rgba(255,255,255,.16)
}
#dragHint{
  position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);
  z-index:18;background:rgba(4,8,18,.68);border:1px solid var(--line);
  border-radius:999px;padding:6px 10px;font-size:10px;color:#d7def0;white-space:nowrap
}

/* Center overlays */
.centerOverlay{
  position:absolute;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(5,7,15,.32);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
#preCountdown{
  font-weight:900;font-size:110px;
  text-shadow:0 0 30px rgba(255,255,255,.32)
}
#performance .move{font-size:30px;font-weight:900;padding:0 18px}
#performance .route{font-size:12px;color:#d9e2f7;margin-top:9px;padding:0 22px}

/* Bottom information area - portrait game-like HUD */
#bottom{
  display:grid;grid-template-columns:1fr;
  gap:7px;
}
#comboPanel{padding:8px 9px}
#comboHeader{display:flex;justify-content:space-between;align-items:center;gap:8px}
#comboHeader strong{font-size:12px}
#scoreBox{font-size:11px;color:var(--muted)}
#scoreBox b{color:var(--text);font-size:15px}
#recipes{
  display:flex;gap:6px;margin-top:7px;overflow:hidden;
}
.recipe{
  flex:1;min-width:0;
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:12px;padding:6px 5px;text-align:center;
}
.recipe .name{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe .seq{font-size:16px;white-space:nowrap;margin-top:3px;letter-spacing:.04em}
#footerRow{display:flex;gap:7px}
#statusCard{flex:1;padding:7px 9px}
#statusCard .mini{font-size:9px;color:var(--muted)}
#statusCard .vals{display:flex;justify-content:space-between;margin-top:3px;font-size:12px}
#resetBtn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
  color:var(--text);border-radius:13px;padding:0 15px;font-weight:700
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="stageInfo" class="hud">
      <div class="row">
        <span id="turnLabel">TURN 1 / 8</span>
        <span id="difficulty" style="font-size:10px;color:var(--muted)">STATIC</span>
      </div>
      <div id="themeName">静寂の導入</div>
      <div id="themeDesc">VOCAL系を含むルートが高得点</div>
    </div>
    <div id="timerBox" class="hud">
      <small>TIME</small>
      <div id="countdown">5</div>
    </div>
  </div>

  <div id="game">
    <div id="audienceGlow"></div>
    <div id="platform"></div>
    <div id="idol">
      <div class="hair"></div><div class="head"></div><div class="body"></div><div class="skirt"></div>
      <div class="leg l1"></div><div class="leg l2"></div><div class="arm"></div><div class="mic"></div>
    </div>
    <canvas id="lineLayer"></canvas>
    <div id="nodeLayer"></div>
    <div id="dragHint">スキルを見つけて一筆書き　指を離すと即決定</div>
    <div id="preCountdown" class="centerOverlay">3</div>
    <div id="performance" class="centerOverlay">
      <div>
        <div id="moveName" class="move">SPECIAL PERFORMANCE!</div>
        <div id="moveRoute" class="route"></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="comboPanel" class="hud">
      <div id="comboHeader">
        <strong>このキャラの基本コンボ</strong>
        <div id="scoreBox">SCORE <b id="score">0</b></div>
      </div>
      <div id="recipes">
        <div class="recipe">
          <div class="name">MOONLIGHT ARC</div>
          <div class="seq">👟 → 🌀 → 〰️</div>
        </div>
        <div class="recipe">
          <div class="name">ECHO BLOOM</div>
          <div class="seq">🌬️ → 〰️ → ◎</div>
        </div>
        <div class="recipe">
          <div class="name">STAR BURST</div>
          <div class="seq">🌀 → 💥 → ◎</div>
        </div>
      </div>
    </div>
    <div id="footerRow">
      <div id="statusCard" class="hud">
        <div class="mini">LIVE STATUS</div>
        <div class="vals"><span>AUDIENCE <b id="audience">20%</b></span><span id="selectedCount">0 CHAIN</span></div>
      </div>
      <button id="resetBtn" type="button">RESET</button>
    </div>
  </div>
</div>

<script>
const skills=[
  {name:"ロングトーン",type:"vocal",label:"VOCAL",icon:"〰️"},
  {name:"ハイトーン",type:"vocal",label:"VOCAL",icon:"↗️"},
  {name:"シャウト",type:"expression",label:"EXPRESSION",icon:"💥"},
  {name:"フェイク",type:"expression",label:"EXPRESSION",icon:"✦"},
  {name:"ステップ",type:"dance",label:"DANCE",icon:"👟"},
  {name:"ターン",type:"dance",label:"DANCE",icon:"🌀"},
  {name:"ブレス",type:"control",label:"CONTROL",icon:"🌬️"},
  {name:"共鳴",type:"resonance",label:"RESONANCE",icon:"◎"}
];
const recipes=[
  {seq:["ステップ","ターン","ロングトーン"],name:"MOONLIGHT ARC",mult:2.4},
  {seq:["ブレス","ロングトーン","共鳴"],name:"ECHO BLOOM",mult:2.1},
  {seq:["ターン","シャウト","共鳴"],name:"STAR BURST",mult:2.7}
];
const themes=[
  {name:"静寂の導入",desc:"VOCAL系を含むルートが高得点",type:"vocal",mult:1.6},
  {name:"観客の期待",desc:"RESONANCEを含むと観客テンション上昇",type:"resonance",mult:1.7},
  {name:"情熱の開放",desc:"EXPRESSION系が高得点",type:"expression",mult:1.8},
  {name:"躍動の間奏",desc:"DANCE系を2個以上繋ぐとボーナス",type:"dance",mult:1.8},
  {name:"静かなブレイク",desc:"CONTROLを含むと次ターン補正",type:"control",mult:1.5},
  {name:"共鳴の波",desc:"RESONANCE始動でコンボ倍率UP",type:"resonance",mult:2.0},
  {name:"サビ",desc:"3チェイン以上で大幅ボーナス",type:"any",mult:2.1},
  {name:"ラスサビ",desc:"全能力補正＋固有技倍率UP",type:"any",mult:2.4}
];

const game=document.getElementById("game");
const nodeLayer=document.getElementById("nodeLayer");
const canvas=document.getElementById("lineLayer");
const ctx=canvas.getContext("2d");
const resetBtn=document.getElementById("resetBtn");

let turn=0,score=0,audience=20,active=false,time=5,timer=null;
let currentNodes=[],drawn=[],dragging=false;
let lastMoveTime=performance.now();

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}

function resizeCanvas(){
  const r=game.getBoundingClientRect();
  canvas.width=r.width*devicePixelRatio;
  canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+"px";
  canvas.style.height=r.height+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  drawLines();
}
addEventListener("resize",resizeCanvas);

function randomPoints(count){
  const pts=[];let tries=0;
  while(pts.length<count&&tries<400){
    tries++;
    const p={x:13+Math.random()*74,y:14+Math.random()*58};
    const ok=pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>19);
    if(ok)pts.push(p);
  }
  while(pts.length<count)pts.push({x:15+Math.random()*70,y:15+Math.random()*55});
  return pts;
}

function setTheme(){
  const t=themes[turn];
  document.getElementById("turnLabel").textContent=`TURN ${turn+1} / 8`;
  document.getElementById("themeName").textContent=t.name;
  document.getElementById("themeDesc").textContent=t.desc;
  document.getElementById("difficulty").textContent=turn<5?"STATIC":"MOVING";
}

function spawn(){
  nodeLayer.innerHTML="";
  drawn=[];currentNodes=[];
  document.getElementById("selectedCount").textContent="0 CHAIN";
  const picks=shuffled(skills).slice(0,5);
  const pts=randomPoints(5);

  picks.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className=`node ${s.type}`;
    el.style.left=pts[i].x+"%";
    el.style.top=pts[i].y+"%";
    el.innerHTML=`<div class="icon">${s.icon}</div><div>${s.name}</div><small>${s.label}</small>`;
    el.dataset.name=s.name;
    el.dataset.type=s.type;

    // Normal play is static. Only the last 3 turns move, and slowly.
    const moving=turn>=5;
    el.dataset.moving=moving?"1":"0";
    const speed=moving?(0.004+(turn-5)*0.0025):0;
    const a=Math.random()*Math.PI*2;
    el._vx=Math.cos(a)*speed;
    el._vy=Math.sin(a)*speed;
    el._px=pts[i].x;el._py=pts[i].y;

    nodeLayer.appendChild(el);
    currentNodes.push(el);
  });
  resizeCanvas();
}

function nodeCenter(el){
  const gr=game.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-gr.left+r.width/2,y:r.top-gr.top+r.height/2}
}
function drawLines(temp){
  const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  if(!drawn.length)return;
  ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=6;
  const grad=ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"#66dcff");grad.addColorStop(.55,"#ff6fbe");grad.addColorStop(1,"#ffd56b");
  ctx.strokeStyle=grad;ctx.shadowColor="#cf88ff";ctx.shadowBlur=15;
  ctx.beginPath();
  drawn.forEach((el,i)=>{
    const p=nodeCenter(el);
    if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  });
  if(temp)ctx.lineTo(temp.x,temp.y);
  ctx.stroke();
  ctx.shadowBlur=0;
}

function localPos(e){
  const r=game.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function hitNode(pos){
  const gr=game.getBoundingClientRect();
  for(const el of currentNodes){
    const r=el.getBoundingClientRect();
    const cx=r.left-gr.left+r.width/2,cy=r.top-gr.top+r.height/2;
    if(Math.hypot(pos.x-cx,pos.y-cy)<r.width*.58)return el;
  }
}
function addNode(el){
  if(drawn.includes(el))return;
  drawn.push(el);el.classList.add("sel");
  document.getElementById("selectedCount").textContent=`${drawn.length} CHAIN`;
  drawLines();
}

game.addEventListener("pointerdown",e=>{
  if(!active)return;
  dragging=true;
  game.setPointerCapture?.(e.pointerId);
  const n=hitNode(localPos(e));if(n)addNode(n);
});
game.addEventListener("pointermove",e=>{
  if(!active||!dragging)return;
  const pos=localPos(e),n=hitNode(pos);
  if(n)addNode(n);
  drawLines(pos);
});
function release(e){
  if(!active||!dragging)return;
  dragging=false;
  drawLines();
  if(drawn.length>0)finishTurn();
}
game.addEventListener("pointerup",release);
game.addEventListener("pointercancel",release);

function startTurn(){
  if(active||turn>=8)return;
  active=true;time=5;drawn=[];
  setTheme();spawn();
  document.getElementById("countdown").textContent="5";

  timer=setInterval(()=>{
    time-=0.1;
    document.getElementById("countdown").textContent=String(Math.max(1,Math.ceil(time)));
    if(time<=0){
      document.getElementById("countdown").textContent="0";
      finishTurn();
    }
  },100);
}

function finishTurn(){
  if(!active)return;
  active=false;
  if(timer){clearInterval(timer);timer=null}

  const names=drawn.map(n=>n.dataset.name);
  const types=drawn.map(n=>n.dataset.type);
  const t=themes[turn];

  let base=names.length*12000;
  let mult=1;
  if(t.type==="any")mult*=1+(Math.max(0,names.length-2)*.25);
  else if(types.includes(t.type))mult*=t.mult;

  let special=null;
  for(const r of recipes){
    if(names.join(">").includes(r.seq.join(">"))){special=r;mult*=r.mult;break}
  }
  if(names.length===5)mult*=1.2;

  const gained=Math.round(base*mult);
  score+=gained;
  audience=Math.min(100,audience+Math.round(names.length*2+(special?8:0)));
  document.getElementById("score").textContent=score.toLocaleString();
  document.getElementById("audience").textContent=audience+"%";

  const perf=document.getElementById("performance");
  document.getElementById("moveName").textContent=special?special.name:(names.length>=4?"PERFORMANCE COMBO":names.length>=2?"CHAIN PERFORMANCE":"SINGLE PERFORMANCE");
  document.getElementById("moveRoute").textContent=(names.join(" → ")||"NO INPUT")+`　+${gained.toLocaleString()}`;
  perf.style.display="flex";

  turn++;
  setTimeout(()=>{
    perf.style.display="none";
    nodeLayer.innerHTML="";
    if(turn>=8){
      document.getElementById("turnLabel").textContent="LIVE CLEAR";
      document.getElementById("countdown").textContent="END";
      document.getElementById("themeName").textContent=`TOTAL SCORE ${score.toLocaleString()}`;
      document.getElementById("themeDesc").textContent="RESETで再挑戦";
    }else{
      startTurn();
    }
  },600);
}

function animateNodes(now){
  const dt=Math.min(40,now-lastMoveTime);lastMoveTime=now;
  if(active){
    for(const el of currentNodes){
      if(el.dataset.moving!=="1"||drawn.includes(el))continue;
      el._px+=el._vx*dt;el._py+=el._vy*dt;
      if(el._px<10){el._px=10;el._vx=Math.abs(el._vx)}
      if(el._px>90){el._px=90;el._vx=-Math.abs(el._vx)}
      if(el._py<12){el._py=12;el._vy=Math.abs(el._vy)}
      if(el._py>76){el._py=76;el._vy=-Math.abs(el._vy)}
      el.style.left=el._px+"%";el.style.top=el._py+"%";
    }
    drawLines();
  }
  requestAnimationFrame(animateNodes);
}
requestAnimationFrame(animateNodes);

function preGameCountdown(){
  const overlay=document.getElementById("preCountdown");
  overlay.style.display="flex";
  const seq=["3","2","1","LIVE!"];
  let i=0;overlay.textContent=seq[i];
  const iv=setInterval(()=>{
    i++;
    if(i>=seq.length){
      clearInterval(iv);
      overlay.style.display="none";
      startTurn();
      return;
    }
    overlay.textContent=seq[i];
  },650);
}
function resetGame(){
  if(timer){clearInterval(timer);timer=null}
  active=false;dragging=false;turn=0;score=0;audience=20;drawn=[];
  nodeLayer.innerHTML="";
  document.getElementById("score").textContent="0";
  document.getElementById("audience").textContent="20%";
  document.getElementById("countdown").textContent="5";
  setTheme();
  setTimeout(preGameCountdown,250);
}
resetBtn.addEventListener("click",resetGame);
resetGame();
</script>
</body>
</html>
