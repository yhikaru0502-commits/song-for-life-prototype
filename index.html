<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HARMONIA ADV v16.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#game{position:relative;width:100%;height:100%;max-width:430px;margin:auto;overflow:hidden;background:#04070d;user-select:none;-webkit-user-select:none}
#bgA,#bgB{position:absolute;inset:0;background:#05070b center/cover no-repeat;transition:opacity .38s ease;will-change:opacity}
#bgB{opacity:0}
#shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.02) 50%,rgba(0,0,0,.56))}
.character{position:absolute;z-index:6;bottom:-2%;height:82%;width:67%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .24s ease,transform .28s ease,filter .24s ease;filter:drop-shadow(0 10px 22px rgba(0,0,0,.65));pointer-events:none}
#rin{left:-12%;transform:translateX(-4%)}
#akari{right:-12%;transform:translateX(4%)}
.character.show{opacity:1;transform:translateX(0)}
.character.dim{filter:brightness(.58) drop-shadow(0 10px 22px rgba(0,0,0,.65));opacity:.72}
.character.focus{height:90%;filter:brightness(1.05) drop-shadow(0 12px 28px rgba(0,0,0,.7));z-index:7}
#hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.72)}
#chapter{padding:6px 9px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(5,8,15,.35);backdrop-filter:blur(8px)}
#center{position:absolute;z-index:12;left:8%;right:8%;top:50%;transform:translateY(-50%);font-size:23px;line-height:1.72;font-weight:800;text-align:center;white-space:pre-line;text-shadow:0 3px 18px rgba(0,0,0,.95);transition:opacity .18s ease}
#center.term{font-size:27px;letter-spacing:.04em}
#card{position:absolute;z-index:13;left:7%;right:7%;top:69%;padding:12px 14px;text-align:center;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);font-size:15px;font-weight:900;letter-spacing:.06em;text-shadow:0 2px 10px #000;display:none}
#dialog{position:absolute;z-index:15;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:150px;padding:24px 18px 28px;border:1px solid rgba(255,255,255,.17);border-radius:18px;background:linear-gradient(145deg,rgba(5,9,18,.84),rgba(13,17,30,.70));backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);box-shadow:0 12px 35px rgba(0,0,0,.38);display:none}
#name{position:absolute;top:-15px;left:14px;padding:6px 16px;border-radius:999px;background:#f3f4f6;color:#111;font-size:13px;font-weight:900;min-width:58px;text-align:center}
#text{font-size:18px;font-weight:650;line-height:1.65;white-space:pre-line;text-shadow:0 2px 8px #000}
#next{position:absolute;right:14px;bottom:9px;font-size:11px;opacity:.72;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateY(3px);opacity:.28}}
#black{position:absolute;inset:0;z-index:45;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease}
#flash{position:absolute;inset:0;z-index:44;background:radial-gradient(circle,#fff 0,rgba(220,200,255,.95) 20%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none}
#flash.fire{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#title,#end{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#1a2a49,#04060b 65%);padding:26px}
#title h1{font-size:35px;letter-spacing:.14em;margin:0}#title p{opacity:.68;margin:12px 0 40px}
.btn{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:12px 28px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.06)}
#end{display:none;background:rgba(2,4,9,.95)}#end b{font-size:22px;line-height:1.7}
#tap{position:absolute;inset:0;z-index:40;display:none}
@media(min-width:700px){#game{box-shadow:0 0 60px rgba(0,0,0,.65)}}
</style>
</head>
<body>
<div id="game">
  <div id="bgA"></div><div id="bgB"></div><div id="shade"></div>
  <img id="rin" class="character" alt=""><img id="akari" class="character" alt="">
  <div id="hud"><span id="chapter">第1章　選ばれし者たち</span><span id="num">01 / 40</span></div>
  <div id="center"></div><div id="card"></div>
  <div id="dialog"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  <div id="black"></div><div id="flash"></div>
  <div id="title"><div><h1>HARMONIA</h1><p>歌姫候補生・第一次選抜</p><span class="btn">TAP TO START</span></div></div>
  <div id="end"><div><small>HARMONIA PROJECT</small><br><br><b>《ハーモニア計画》<br>第一次選抜会場</b><br><br><small>TO BE CONTINUED</small></div></div>
  <div id="tap"></div>
</div>
<script>
const scenes=[{"n": 1, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "かつて人類は、世界から“光”を失った。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 2, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "化石燃料の枯渇。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 3, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "人類は太陽光による、新たなエネルギー時代へ進もうとしていた。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 4, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "だが、その技術を巡って――《エネルギー戦争》が勃発。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 5, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "世界中の巨大ソーラー施設が破壊され、人類は深刻なエネルギー危機に陥った。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 6, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "そんな暗闇の中。日本で、未知のエネルギーが発見される。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 7, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "人間が歌う時にだけ生まれる、光を伴う生命振動。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 8, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "――《存在波（エグジスタンス・ウェーブ）》", "mode": "center", "bg": "assets/bg/bg_dark_city.png", "term": true}, {"n": 9, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "そして、誰よりも強い存在波を放つ一人の少女が現れた。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 10, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "彼女が歌った時、停止していた巨大構造物《陽傘》が、再び動き出した。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 11, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "失われていた空が、都市に戻った。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 12, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "人々は彼女を――《歌姫（DIVA）》と呼んだ。", "mode": "center", "bg": "assets/bg/bg_dark_city.png", "term": true}, {"n": 13, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "そして今。世界は、新たな歌姫を探している。", "mode": "center", "bg": "assets/bg/bg_dark_city.png", "card": "《ハーモニア計画／第一次選抜》", "transition": "black_hold"}, {"n": 14, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "家族を失った。", "mode": "center", "bg": "assets/event/ev_01.png"}, {"n": 15, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "世界を恨んだ。", "mode": "center", "bg": "assets/event/ev_01.png"}, {"n": 16, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "だから私は、歌った。", "mode": "center", "bg": "assets/event/ev_01.png"}, {"n": 17, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "この世界に――復讐するために。", "mode": "center", "bg": "assets/event/ev_02.png", "flash": true}, {"n": 18, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "存在波を放つことができれば、私は力を手に入れられる。", "mode": "dialog", "bg": "assets/event/ev_03.png"}, {"n": 19, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "そのために歌ってきた。", "mode": "dialog", "bg": "assets/event/ev_03.png"}, {"n": 20, "section": "凛：過去と現在", "speaker": "凛", "text": "ずっと、一人で。", "mode": "dialog", "bg": "assets/event/ev_03.png", "transition": "black_hold"}, {"n": 21, "section": "光と影の邂逅", "speaker": "灯", "text": "ねえ！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": null, "akariOff": true}, {"n": 22, "section": "光と影の邂逅", "speaker": "灯", "text": "あなたも、オーディション受けに来たの？", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 23, "section": "光と影の邂逅", "speaker": "凛", "text": "……そうだけど", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 24, "section": "光と影の邂逅", "speaker": "灯", "text": "やっぱり！　私も！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 25, "section": "光と影の邂逅", "speaker": "灯", "text": "私ね、DIVAに救ってもらったんだ", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 26, "section": "光と影の邂逅", "speaker": "灯", "text": "だから今度は、私がDIVAになって――", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 27, "section": "光と影の邂逅", "speaker": "灯", "text": "みんなを救いたいの！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "akari"}, {"n": 28, "section": "光と影の邂逅", "speaker": "凛", "text": "…………", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "rin"}, {"n": 29, "section": "光と影の邂逅", "speaker": "凛", "text": "そう。頑張って", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 30, "section": "光と影の邂逅", "speaker": "凛", "text": "それじゃ", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 31, "section": "光と影の邂逅", "speaker": "灯", "text": "えっ、ちょっと待って！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 32, "section": "光と影の邂逅", "speaker": "灯", "text": "せっかく同じオーディション受けるんだから、一緒に行こうよ！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 33, "section": "光と影の邂逅", "speaker": "凛", "text": "……なんで？", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "rin"}, {"n": 34, "section": "光と影の邂逅", "speaker": "灯", "text": "なんでって……", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "akari"}, {"n": 35, "section": "光と影の邂逅", "speaker": "灯", "text": "同じところ行くんだから、その方が楽しいじゃん！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "akari"}, {"n": 36, "section": "光と影の邂逅", "speaker": "凛", "text": "…………", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "rin"}, {"n": 37, "section": "光と影の邂逅", "speaker": "凛", "text": "……勝手にすれば", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 38, "section": "光と影の邂逅", "speaker": "灯", "text": "うん。じゃあ勝手についてく！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 39, "section": "第一次選抜へ", "speaker": "凛（モノローグ）", "text": "変なやつ。", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "fallback": true}, {"n": 40, "section": "第一次選抜へ", "speaker": "凛（モノローグ）", "text": "世界を、救う――か。", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "fallback": true}];
let idx=-1,started=false,busy=false,bgFront="A";
const q=id=>document.getElementById(id);
const bgA=q("bgA"),bgB=q("bgB"),rin=q("rin"),akari=q("akari"),center=q("center"),dialog=q("dialog"),black=q("black"),flash=q("flash");

function setBg(url, instant=false){
  const front=bgFront==="A"?bgA:bgB, back=bgFront==="A"?bgB:bgA;
  if(front.dataset.src===url) return;
  back.style.backgroundImage=`url("${url}")`;
  back.dataset.src=url;
  if(instant){front.style.opacity=0;back.style.opacity=1;bgFront=bgFront==="A"?"B":"A";return}
  back.style.opacity=1; front.style.opacity=0; bgFront=bgFront==="A"?"B":"A";
}

function setCharacters(s){
  rin.className="character";akari.className="character";
  if(s.rin){rin.src=s.rin;rin.classList.add("show")}
  if(s.akari){akari.src=s.akari;akari.classList.add("show")}
  if(s.focus==="rin"){rin.classList.add("focus");akari.classList.add("dim")}
  if(s.focus==="akari"){akari.classList.add("focus");rin.classList.add("dim")}
}

function render(s, instant=false){
  q("num").textContent=String(s.n).padStart(2,"0")+" / 40";
  q("chapter").textContent="第1章　"+s.section;
  setBg(s.bg,instant);setCharacters(s);
  center.style.display=s.mode==="center"?"block":"none";
  dialog.style.display=s.mode==="dialog"?"block":"none";
  center.className=s.term?"term":"";
  center.textContent=s.text;
  q("name").textContent=s.speaker||"";
  q("text").textContent=s.text;
  q("card").style.display=s.card?"block":"none";
  q("card").textContent=s.card||"";
  if(s.flash){flash.classList.remove("fire");void flash.offsetWidth;flash.classList.add("fire")}
}

function blackTransition(nextScene){
  busy=true;black.style.opacity=1;
  setTimeout(()=>{render(nextScene,true)},380);
  setTimeout(()=>{black.style.opacity=0},1180);
  setTimeout(()=>{busy=false},1510);
}

function startGame(){
  if(started)return;
  started=true;
  q("title").style.display="none";
  q("tap").style.display="block";
  idx=0;
  render(scenes[idx],true);
}

function advance(){
  if(busy||!started)return;
  if(idx>=scenes.length-1){
    q("end").style.display="flex";
    return;
  }
  const current=scenes[idx], next=scenes[idx+1];
  idx++;
  if(current.transition==="black_hold") blackTransition(next);
  else render(next);
}

q("title").addEventListener("click",startGame);
q("title").addEventListener("touchend",e=>{
  e.preventDefault();
  startGame();
},{passive:false});

q("tap").addEventListener("click",advance);
q("tap").addEventListener("touchend",e=>{
  e.preventDefault();
  advance();
},{passive:false});
</script>
</body>
</html>
