<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SONG FOR LIFE - Live Audition Prototype v12</title>
<style>
:root {
  --glass:rgba(8,12,24,.48);
  --line:rgba(255,255,255,.16);
  --text:#fff;
  --muted:rgba(255,255,255,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#050812;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;touch-action:none;overscroll-behavior:none;
}
button{font:inherit}
#app{width:100%;height:100%;background:#050812}
#game{
  position:relative;width:100%;height:100%;
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  background:#050812;
}
#liveBg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center center;
  z-index:0;pointer-events:none;
}
#videoShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(2,5,12,.34) 0%,rgba(2,5,12,.05) 22%,rgba(2,5,12,.02) 62%,rgba(2,5,12,.46) 100%),
    radial-gradient(circle at 50% 45%,transparent 0 50%,rgba(2,5,12,.15) 100%);
}
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#topHud{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  z-index:30;
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:7px;
  align-items:start;
  pointer-events:none;
}
#stageInfo{border-radius:14px;padding:8px 10px;min-width:0}
.hudRow{display:flex;justify-content:space-between;gap:8px;align-items:center}
#turnLabel{font-size:14px;font-weight:800}
#difficulty{font-size:9px;color:var(--muted)}
#themeName{font-size:12px;font-weight:700;margin-top:2px}
#themeDesc{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoreHud,#timerBox{
  border-radius:14px;padding:7px 9px;text-align:center;min-width:68px;
}
.hudLabel{font-size:8px;color:var(--muted);letter-spacing:.08em}
#score{font-size:16px;font-weight:800;margin-top:1px}
#countdown{font-size:29px;font-weight:900;line-height:1;margin-top:2px}
#audienceHud{
  position:absolute;
  left:max(10px,env(safe-area-inset-left));
  top:108px;z-index:30;
  border-radius:999px;padding:6px 9px;
  display:flex;gap:8px;align-items:center;
  font-size:9px;pointer-events:none;
}
#audienceHud b{font-size:12px}
#lineLayer{position:absolute;inset:0;z-index:8;pointer-events:none}
#nodeLayer{position:absolute;inset:0;z-index:12;pointer-events:none}
.node{
  position:absolute;width:78px;height:78px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.76);
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.24),rgba(9,14,27,.56));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:800;
  box-shadow:0 0 18px currentColor,inset 0 0 20px rgba(255,255,255,.10);
  pointer-events:none;
}
.node .icon{font-size:26px;line-height:1;margin-bottom:2px}
.node small{font-size:8px;opacity:.82}
.node.vocal{color:#69ddff}
.node.expression{color:#ff72c0}
.node.dance{color:#ffd76e}
.node.control{color:#8cf6ae}
.node.resonance{color:#c4a2ff}
.node.sel{
  transform:translate(-50%,-50%) scale(1.12);
  box-shadow:0 0 30px currentColor,0 0 55px currentColor;
}
#touchSurface{
  position:absolute;inset:0;z-index:25;
  background:transparent;pointer-events:auto;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
#comboDock{
  position:absolute;
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  bottom:calc(max(10px,env(safe-area-inset-bottom)) + 10px);
  z-index:31;border-radius:16px;padding:8px 8px 9px;
  pointer-events:none;
}
.comboTitle{
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;color:var(--muted);letter-spacing:.05em;
}
#selectedCount{color:#fff;font-weight:700}
.recipeRow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.recipe{
  background:rgba(13,18,34,.45);
  border:1px solid rgba(255,255,255,.10);
  border-radius:11px;padding:5px 4px;text-align:center;
}
.recipeName{font-size:7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipeSeq{font-size:15px;margin-top:2px;white-space:nowrap}
#resetBtn{
  position:absolute;
  right:max(12px,env(safe-area-inset-right));
  top:153px;z-index:35;
  border:1px solid var(--line);
  background:rgba(8,12,24,.48);
  color:#fff;border-radius:999px;
  padding:6px 10px;font-size:9px;font-weight:700;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:auto;
}
#dragHint{
  position:absolute;left:50%;bottom:125px;
  transform:translateX(-50%);
  z-index:18;background:rgba(4,8,18,.48);
  border:1px solid var(--line);border-radius:999px;
  padding:5px 9px;font-size:9px;color:rgba(255,255,255,.82);
  white-space:nowrap;pointer-events:none;
}
.centerOverlay{
  position:absolute;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(3,6,14,.26);
  backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
  pointer-events:none;
}
#preCountdown{
  font-size:104px;font-weight:900;
  text-shadow:0 0 30px rgba(255,255,255,.35);
}
#performanceInner{width:100%;padding:0 20px}
#performance .move{
  font-size:30px;font-weight:900;line-height:1.05;
  text-shadow:0 0 18px rgba(255,92,168,.65);
}
#gainScore{
  font-size:58px;font-weight:900;line-height:1;
  margin-top:10px;
  text-shadow:0 0 20px rgba(255,92,168,.85),0 0 38px rgba(104,223,255,.45);
}
#performance .route{font-size:11px;color:rgba(255,255,255,.82);margin-top:8px}
@media (min-width:700px){
  #game{max-width:430px;margin:0 auto}
}

#cutinOverlay{
  background:rgba(0,0,0,.08);
  overflow:hidden;
  pointer-events:none;
}
#cutinVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}
#cutinScoreBox{
  position:absolute;
  left:0;right:0;bottom:8%;
  z-index:3;
  text-align:center;
  padding:16px 18px 18px;
  background:linear-gradient(180deg,transparent,rgba(4,6,14,.72));
  text-shadow:0 0 18px rgba(0,0,0,.8);
}
#cutinMoveName{
  font-size:20px;
  font-weight:900;
  letter-spacing:.06em;
}
#cutinGainScore{
  font-size:58px;
  line-height:1;
  font-weight:900;
  margin-top:8px;
}
#cutinRoute{
  margin-top:8px;
  font-size:11px;
  color:rgba(255,255,255,.86);
}
#finalScoreOverlay{
  z-index:80;
  background:rgba(3,5,12,.74);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#finalScoreInner{
  width:100%;
  text-align:center;
  padding:24px;
}
#finalScoreLabel{
  font-size:18px;
  font-weight:800;
  letter-spacing:.18em;
  opacity:.82;
}
#finalScoreValue{
  margin-top:14px;
  font-size:72px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.03em;
  text-shadow:0 0 26px rgba(255,255,255,.25);
}
#finalScoreSub{
  margin-top:16px;
  font-size:20px;
  font-weight:900;
}

</style>
</head>
<body>
<div id="app">
  <div id="game">
    <video id="liveBg" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="play_bg.mp4" type="video/mp4">
    </video>
    <div id="videoShade"></div>

    <div id="topHud">
      <div id="stageInfo" class="glass">
        <div class="hudRow">
          <span id="turnLabel">TURN 1 / 6</span>
          <span id="difficulty">STATIC</span>
        </div>
        <div id="themeName">静寂の導入</div>
        <div id="themeDesc">VOCAL系を含むルートが高得点</div>
      </div>
      <div id="scoreHud" class="glass">
        <div class="hudLabel">SCORE</div>
        <div id="score">0</div>
      </div>
      <div id="timerBox" class="glass">
        <div class="hudLabel">TIME</div>
        <div id="countdown">7</div>
      </div>
    </div>

    <div id="audienceHud" class="glass">
      <span>AUDIENCE</span><b id="audience">20%</b>
    </div>

    <canvas id="lineLayer"></canvas>
    <div id="nodeLayer"></div>
    <div id="touchSurface" aria-label="スキル選択エリア"></div>

    <div id="comboDock" class="glass">
      <div class="comboTitle">
        <span>COMBO ROUTES</span>
        <span id="selectedCount">0 CHAIN</span>
      </div>
      <div class="recipeRow">
        <div class="recipe">
          <div class="recipeName">MOONLIGHT ARC</div>
          <div class="recipeSeq">👟 → 🌀 → 〰️</div>
        </div>
        <div class="recipe">
          <div class="recipeName">ECHO BLOOM</div>
          <div class="recipeSeq">🌬️ → 〰️ → ◎</div>
        </div>
        <div class="recipe">
          <div class="recipeName">STAR BURST</div>
          <div class="recipeSeq">🌀 → 💥 → ◎</div>
        </div>
      </div>
    </div>

    <button id="resetBtn" type="button">RESET</button>
    <div id="dragHint">スキルを見つけて一筆書き　指を離すと即決定</div>

    <div id="preCountdown" class="centerOverlay">3</div>
    <div id="cutinOverlay" class="centerOverlay">
      <video id="cutinVideo" muted playsinline preload="auto"></video>
      <div id="cutinScoreBox">
        <div id="cutinMoveName">PERFORMANCE</div>
        <div id="cutinGainScore">+0</div>
        <div id="cutinRoute"></div>
      </div>
    </div>

    <div id="finalScoreOverlay" class="centerOverlay">
      <div id="finalScoreInner">
        <div id="finalScoreLabel">FINAL SCORE</div>
        <div id="finalScoreValue">0</div>
        <div id="finalScoreSub">LIVE CLEAR</div>
      </div>
    </div>
  </div>
</div>
<script>


const liveBg=document.getElementById("liveBg");
function keepLiveVideoPlaying(){
  if(!liveBg) return;
  const p=liveBg.play();
  if(p && typeof p.catch==="function") p.catch(()=>{});
}

const skills=[
  {name:"ロングトーン",type:"vocal",label:"VOCAL",icon:"〰️"},
  {name:"ハイトーン",type:"vocal",label:"VOCAL",icon:"↗️"},
  {name:"シャウト",type:"expression",label:"EXPRESSION",icon:"💥"},
  {name:"フェイク",type:"expression",label:"EXPRESSION",icon:"✦"},
  {name:"ステップ",type:"dance",label:"DANCE",icon:"👟"},
  {name:"ターン",type:"dance",label:"DANCE",icon:"🌀"},
  {name:"ブレス",type:"control",label:"CONTROL",icon:"🌬️"},
  {name:"共鳴",type:"resonance",label:"RESONANCE",icon:"◎"}
];
const recipes=[
  {seq:["ステップ","ターン","ロングトーン"],name:"MOONLIGHT ARC",mult:2.4},
  {seq:["ブレス","ロングトーン","共鳴"],name:"ECHO BLOOM",mult:2.1},
  {seq:["ターン","シャウト","共鳴"],name:"STAR BURST",mult:2.7}
];
const themes=[
  {name:"静寂の導入",desc:"VOCAL系を含むルートが高得点",type:"vocal",mult:1.6},
  {name:"観客の期待",desc:"RESONANCEを含むと観客テンション上昇",type:"resonance",mult:1.7},
  {name:"情熱の開放",desc:"EXPRESSION系が高得点",type:"expression",mult:1.8},
  {name:"躍動の間奏",desc:"DANCE系を2個以上繋ぐとボーナス",type:"dance",mult:1.8},
  {name:"静かなブレイク",desc:"CONTROLを含むと次ターン補正",type:"control",mult:1.5},
  {name:"共鳴の波",desc:"RESONANCE始動でコンボ倍率UP",type:"resonance",mult:2.0}
];

const game=document.getElementById("game");
const nodeLayer=document.getElementById("nodeLayer");
const canvas=document.getElementById("lineLayer");
const ctx=canvas.getContext("2d");
const resetBtn=document.getElementById("resetBtn");
const cutinOverlay=document.getElementById("cutinOverlay");
const cutinVideo=document.getElementById("cutinVideo");
const finalScoreOverlay=document.getElementById("finalScoreOverlay");

let turn=0,score=0,audience=20,active=false,time=7,timer=null;
let currentNodes=[],drawn=[],dragging=false;
let lastMoveTime=performance.now();

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}

function resizeCanvas(){
  const r=game.getBoundingClientRect();
  canvas.width=r.width*devicePixelRatio;
  canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+"px";
  canvas.style.height=r.height+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  drawLines();
}
addEventListener("resize",resizeCanvas);

function randomPoints(count){
  const pts=[];let tries=0;
  while(pts.length<count&&tries<400){
    tries++;
    const p={x:13+Math.random()*74,y:14+Math.random()*58};
    const ok=pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>19);
    if(ok)pts.push(p);
  }
  while(pts.length<count)pts.push({x:15+Math.random()*70,y:15+Math.random()*55});
  return pts;
}

function setTheme(){
  const t=themes[turn];
  document.getElementById("turnLabel").textContent=`TURN ${turn+1} / 6`;
  document.getElementById("themeName").textContent=t.name;
  document.getElementById("themeDesc").textContent=t.desc;
  document.getElementById("difficulty").textContent=turn<5?"STATIC":"MOVING";
}

function spawn(){
  nodeLayer.innerHTML="";
  drawn=[];currentNodes=[];
  document.getElementById("selectedCount").textContent="0 CHAIN";
  const picks=shuffled(skills).slice(0,5);
  const pts=randomPoints(5);

  picks.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className=`node ${s.type}`;
    el.style.left=pts[i].x+"%";
    el.style.top=pts[i].y+"%";
    el.innerHTML=`<div class="icon">${s.icon}</div><div>${s.name}</div><small>${s.label}</small>`;
    el.dataset.name=s.name;
    el.dataset.type=s.type;

    // Normal play is static. Only the last 3 turns move, and slowly.
    const moving=turn>=5;
    el.dataset.moving=moving?"1":"0";
    const speed=moving?(0.004+(turn-5)*0.0025):0;
    const a=Math.random()*Math.PI*2;
    el._vx=Math.cos(a)*speed;
    el._vy=Math.sin(a)*speed;
    el._px=pts[i].x;el._py=pts[i].y;

    nodeLayer.appendChild(el);
    currentNodes.push(el);
  });
  resizeCanvas();
}

function nodeCenter(el){
  const gr=game.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-gr.left+r.width/2,y:r.top-gr.top+r.height/2}
}
function drawLines(temp){
  const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  if(!drawn.length)return;
  ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=6;
  const grad=ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"#66dcff");grad.addColorStop(.55,"#ff6fbe");grad.addColorStop(1,"#ffd56b");
  ctx.strokeStyle=grad;ctx.shadowColor="#cf88ff";ctx.shadowBlur=15;
  ctx.beginPath();
  drawn.forEach((el,i)=>{
    const p=nodeCenter(el);
    if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  });
  if(temp)ctx.lineTo(temp.x,temp.y);
  ctx.stroke();
  ctx.shadowBlur=0;
}

function localPos(e){
  const r=game.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function hitNode(pos){
  const gr=game.getBoundingClientRect();
  for(const el of currentNodes){
    const r=el.getBoundingClientRect();
    const cx=r.left-gr.left+r.width/2,cy=r.top-gr.top+r.height/2;
    if(Math.hypot(pos.x-cx,pos.y-cy)<r.width*.58)return el;
  }
}
function addNode(el){
  if(drawn.includes(el))return;
  drawn.push(el);el.classList.add("sel");
  document.getElementById("selectedCount").textContent=`${drawn.length} CHAIN`;
  drawLines();
}



const touchSurface=document.getElementById("touchSurface");

function posFromClient(clientX,clientY){
  const r=game.getBoundingClientRect();
  return {x:clientX-r.left,y:clientY-r.top};
}
function beginSelection(clientX,clientY){
  if(!active)return;
  dragging=true;
  keepLiveVideoPlaying();
  const pos=posFromClient(clientX,clientY);
  const n=hitNode(pos);
  if(n)addNode(n);
  drawLines(pos);
}
function moveSelection(clientX,clientY){
  if(!active||!dragging)return;
  const pos=posFromClient(clientX,clientY);
  const n=hitNode(pos);
  if(n)addNode(n);
  drawLines(pos);
}
function endSelection(){
  if(!active||!dragging)return;
  dragging=false;
  drawLines();
  if(drawn.length>0)finishTurn();
}

/* iPhone / iPad: use native touch events on a dedicated transparent layer. */
touchSurface.addEventListener("touchstart",e=>{
  if(!active||!e.touches.length)return;
  e.preventDefault();
  const t=e.touches[0];
  beginSelection(t.clientX,t.clientY);
},{passive:false});

touchSurface.addEventListener("touchmove",e=>{
  if(!active||!dragging||!e.touches.length)return;
  e.preventDefault();
  const t=e.touches[0];
  moveSelection(t.clientX,t.clientY);
},{passive:false});

touchSurface.addEventListener("touchend",e=>{
  if(!dragging)return;
  e.preventDefault();
  endSelection();
},{passive:false});

touchSurface.addEventListener("touchcancel",e=>{
  if(!dragging)return;
  e.preventDefault();
  endSelection();
},{passive:false});

/* PC: mouse fallback for the same input surface. */
touchSurface.addEventListener("mousedown",e=>{
  if(!active)return;
  e.preventDefault();
  beginSelection(e.clientX,e.clientY);
});
window.addEventListener("mousemove",e=>{
  if(!dragging)return;
  e.preventDefault();
  moveSelection(e.clientX,e.clientY);
});
window.addEventListener("mouseup",e=>{
  if(!dragging)return;
  e.preventDefault();
  endSelection();
});

function startTurn(){
  if(active||turn>=6)return;
  active=true;time=7;drawn=[];
  setTheme();spawn();
  document.getElementById("countdown").textContent="7";

  timer=setInterval(()=>{
    time-=0.1;
    document.getElementById("countdown").textContent=String(Math.max(1,Math.ceil(time)));
    if(time<=0){
      document.getElementById("countdown").textContent="0";
      finishTurn();
    }
  },100);
}

function finishTurn(){
  if(!active)return;
  active=false;
  if(timer){clearInterval(timer);timer=null}

  const names=drawn.map(n=>n.dataset.name);
  const types=drawn.map(n=>n.dataset.type);
  const t=themes[turn];

  let base=names.length*12000;
  let mult=1;
  if(t.type==="any") mult*=1+(Math.max(0,names.length-2)*.25);
  else if(types.includes(t.type)) mult*=t.mult;

  let special=null;
  for(const r of recipes){
    if(names.join(">").includes(r.seq.join(">"))){special=r;mult*=r.mult;break}
  }
  if(names.length===5)mult*=1.2;

  const gained=Math.round(base*mult);
  score+=gained;
  audience=Math.min(100,audience+Math.round(names.length*2+(special?8:0)));

  document.getElementById("score").textContent=score.toLocaleString();
  document.getElementById("audience").textContent=audience+"%";

  const moveTitle=special?special.name:(names.length>=4?"PERFORMANCE COMBO":names.length>=2?"CHAIN PERFORMANCE":"SINGLE PERFORMANCE");
  document.getElementById("cutinMoveName").textContent=moveTitle;
  document.getElementById("cutinGainScore").textContent=`+${gained.toLocaleString()}`;
  document.getElementById("cutinRoute").textContent=names.join(" → ")||"NO INPUT";

  const completedTurn=turn+1;
  turn++;

  nodeLayer.innerHTML="";
  cutinVideo.src=`cutin_${completedTurn}.mp4`;
  cutinVideo.currentTime=0;
  cutinOverlay.style.display="flex";

  const advance=()=>{
    cutinVideo.removeEventListener("ended",advance);
    cutinOverlay.style.display="none";
    cutinVideo.pause();

    if(turn>=6){
      document.getElementById("turnLabel").textContent="LIVE CLEAR";
      document.getElementById("countdown").textContent="END";
      document.getElementById("themeName").textContent="FINAL RESULT";
      document.getElementById("themeDesc").textContent="6ターン終了";

      document.getElementById("finalScoreValue").textContent=score.toLocaleString();
      finalScoreOverlay.style.display="flex";
    }else{
      startTurn();
    }
  };

  cutinVideo.addEventListener("ended",advance,{once:true});
  const p=cutinVideo.play();
  if(p && typeof p.catch==="function"){
    p.catch(()=>{
      setTimeout(advance,1800);
    });
  }
}

function animateNodes(now){
  const dt=Math.min(40,now-lastMoveTime);lastMoveTime=now;
  if(active){
    for(const el of currentNodes){
      if(el.dataset.moving!=="1"||drawn.includes(el))continue;
      el._px+=el._vx*dt;el._py+=el._vy*dt;
      if(el._px<10){el._px=10;el._vx=Math.abs(el._vx)}
      if(el._px>90){el._px=90;el._vx=-Math.abs(el._vx)}
      if(el._py<12){el._py=12;el._vy=Math.abs(el._vy)}
      if(el._py>76){el._py=76;el._vy=-Math.abs(el._vy)}
      el.style.left=el._px+"%";el.style.top=el._py+"%";
    }
    drawLines();
  }
  requestAnimationFrame(animateNodes);
}
requestAnimationFrame(animateNodes);

function preGameCountdown(){
  keepLiveVideoPlaying();
  const overlay=document.getElementById("preCountdown");
  overlay.style.display="flex";
  overlay.style.background="rgba(3,6,14,.48)";
  const seq=["3","2","1","LIVE START!"];
  let i=0;overlay.textContent=seq[i];
  const iv=setInterval(()=>{
    i++;
    if(i>=seq.length){
      clearInterval(iv);
      overlay.style.display="none";
      startTurn();
      return;
    }
    overlay.textContent=seq[i];
  },650);
}
function resetGame(){
  if(timer){clearInterval(timer);timer=null}
  active=false;dragging=false;turn=0;score=0;audience=20;drawn=[];
  nodeLayer.innerHTML="";
  cutinOverlay.style.display="none";
  finalScoreOverlay.style.display="none";
  cutinVideo.pause();
  cutinVideo.removeAttribute("src");
  document.getElementById("score").textContent="0";
  document.getElementById("audience").textContent="20%";
  document.getElementById("countdown").textContent="7";
  setTheme();
  setTimeout(preGameCountdown,250);
}
resetBtn.addEventListener("click",resetGame);
resetGame();

</script>
