<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>HARMONIA ADV v15</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game{position:relative;width:100%;height:100%;max-width:430px;margin:auto;overflow:hidden;background:#080b13;user-select:none}
#bg{position:absolute;inset:0;transition:.4s;background:radial-gradient(circle at 50% 35%,#293b55,#060810 70%)}#bg.memory{background:radial-gradient(circle at 60% 30%,#65362f,#09090d 62%)}#bg.city,#bg.street,#bg.venue{background:linear-gradient(#647c89 0 43%,#303a40 44%,#11161d 100%)}#bg.venue{background:linear-gradient(#718994 0 36%,#28333a 37% 100%)}
#shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55));pointer-events:none}
.char{position:absolute;bottom:0;width:62%;height:72%;opacity:0;transition:.25s;filter:drop-shadow(0 10px 20px #000)}.char.show{opacity:.8}.char:before{content:"";position:absolute;inset:7% 16% 0;border-radius:48% 48% 20% 20%;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.15)}.char:after{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;text-shadow:0 3px 10px #000}#rin{left:-7%}#rin:after{content:"凛"}#akari{right:-7%}#akari:after{content:"灯"}
#hud{position:absolute;z-index:10;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-size:10px;opacity:.72}
#center{position:absolute;z-index:20;left:8%;right:8%;top:50%;transform:translateY(-50%);font-size:23px;line-height:1.7;font-weight:800;text-align:center;white-space:pre-line;text-shadow:0 3px 18px #000}
#box{position:absolute;z-index:20;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:155px;padding:24px 18px;border:1px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(6,10,20,.78);backdrop-filter:blur(12px);display:none}#name{position:absolute;top:-15px;left:15px;background:#f4f4f5;color:#111;padding:6px 16px;border-radius:99px;font-size:13px;font-weight:900}#text{font-size:18px;line-height:1.65;font-weight:650;white-space:pre-line}#arrow{position:absolute;right:14px;bottom:9px;font-size:11px;animation:p 1s infinite}@keyframes p{50%{transform:translateY(3px);opacity:.3}}
#title,#end{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#1e3154,#05070d 65%)}#title h1{font-size:35px;letter-spacing:.14em;margin:0}#title p{opacity:.65;margin:12px 0 42px}.btn{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:12px 28px;font-weight:800}#end{display:none;background:rgba(3,5,10,.96)}#end b{font-size:22px;line-height:1.7}#tap{position:absolute;inset:0;z-index:60}
</style></head><body><div id="game"><div id="bg"></div><div id="shade"></div><div id="rin" class="char"></div><div id="akari" class="char"></div><div id="hud"><span>第1章　選ばれし者たち</span><span id="num">01 / 40</span></div><div id="center"></div><div id="box"><div id="name"></div><div id="text"></div><div id="arrow">▼</div></div><div id="title"><div><h1>HARMONIA</h1><p>歌姫候補生・第一次選抜</p><span class="btn">TAP TO START</span></div></div><div id="end"><div><small>HARMONIA PROJECT</small><br><br><b>《ハーモニア計画》<br>第一次選抜会場</b><br><br><small>TO BE CONTINUED</small></div></div><div id="tap"></div></div>
<script>
const S=[{"n": 1, "text": "かつて人類は、\n世界から“光”を失った。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 2, "text": "化石燃料の枯渇。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 3, "text": "人類は太陽光による、\n新たなエネルギー時代へ進もうとしていた。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 4, "text": "だが、その技術を巡って――\n《エネルギー戦争》が勃発。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 5, "text": "世界中の巨大ソーラー施設が破壊され、\n人類は深刻なエネルギー危機に陥った。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 6, "text": "そんな暗闇の中。\n日本で、未知のエネルギーが発見される。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 7, "text": "人間が歌う時にだけ生まれる、\n光を伴う生命振動。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 8, "text": "――《存在波（エグジスタンス・ウェーブ）》", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 9, "text": "そして、誰よりも強い存在波を放つ\n一人の少女が現れた。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 10, "text": "彼女が歌った時、\n停止していた巨大構造物《陽傘》が、再び動き出した。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 11, "text": "失われていた空が、\n都市に戻った。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 12, "text": "人々は彼女を――\n《歌姫（DIVA）》と呼んだ。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 13, "text": "そして今。\n世界は、新たな歌姫を探している。", "mode": "center", "bg": "prologue", "speaker": "", "rin": false, "akari": false}, {"n": 14, "text": "家族を失った。", "mode": "center", "bg": "memory", "speaker": "", "rin": true, "akari": false}, {"n": 15, "text": "世界を恨んだ。", "mode": "center", "bg": "memory", "speaker": "", "rin": true, "akari": false}, {"n": 16, "text": "だから私は、歌った。", "mode": "center", "bg": "memory", "speaker": "", "rin": true, "akari": false}, {"n": 17, "text": "この世界に――\n復讐するために。", "mode": "center", "bg": "memory", "speaker": "", "rin": true, "akari": false}, {"n": 18, "text": "存在波を放つことができれば、\n私は力を手に入れられる。", "mode": "dialog", "bg": "city", "speaker": "凛", "rin": true, "akari": false}, {"n": 19, "text": "そのために歌ってきた。\nずっと、一人で。", "mode": "dialog", "bg": "city", "speaker": "凛", "rin": true, "akari": false}, {"n": 20, "text": "……歌えばいいんでしょ", "mode": "dialog", "bg": "city", "speaker": "凛", "rin": true, "akari": false}, {"n": 21, "text": "ねえ！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": false}, {"n": 22, "text": "あなたも、オーディション受けに来たの？", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 23, "text": "……そうだけど", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 24, "text": "やっぱり！　私も！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 25, "text": "私ね、DIVAに救ってもらったんだ", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 26, "text": "だから今度は、私がDIVAになって――", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 27, "text": "みんなを救いたいの！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 28, "text": "…………", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 29, "text": "そう。頑張って", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 30, "text": "それじゃ", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 31, "text": "えっ、ちょっと待って！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 32, "text": "せっかく同じオーディション受けるんだから、\n一緒に行こうよ！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 33, "text": "……なんで？", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 34, "text": "なんでって……", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 35, "text": "同じところ行くんだから、\nその方が楽しいじゃん！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 36, "text": "…………", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 37, "text": "……勝手にすれば", "mode": "dialog", "bg": "street", "speaker": "凛", "rin": true, "akari": true}, {"n": 38, "text": "うん。じゃあ勝手についてく！", "mode": "dialog", "bg": "street", "speaker": "灯", "rin": true, "akari": true}, {"n": 39, "text": "変なやつ。", "mode": "dialog", "bg": "venue", "speaker": "凛", "rin": true, "akari": true}, {"n": 40, "text": "世界を、救う――か。", "mode": "dialog", "bg": "venue", "speaker": "凛", "rin": true, "akari": true}];let i=-1,started=false;
const q=x=>document.getElementById(x),bg=q("bg"),rin=q("rin"),akari=q("akari"),center=q("center"),box=q("box");
function render(s){q("num").textContent=String(s.n).padStart(2,"0")+" / 40";bg.className=s.bg;rin.className="char"+(s.rin?" show":"");akari.className="char"+(s.akari?" show":"");center.style.display=s.mode==="center"?"block":"none";box.style.display=s.mode==="dialog"?"block":"none";center.textContent=s.text;q("text").textContent=s.text;q("name").textContent=s.speaker;}
function next(){if(!started){started=true;q("title").style.display="none";i=0;render(S[i]);return}if(i>=S.length-1){q("end").style.display="flex";return}render(S[++i]);}
q("tap").addEventListener("click",next);
</script></body></html>
