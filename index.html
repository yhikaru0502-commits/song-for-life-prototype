<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HARMONIA ADV v24</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#game{position:relative;width:100%;height:100%;max-width:430px;margin:auto;overflow:hidden;background:#04070d;user-select:none;-webkit-user-select:none}
#bgA,#bgB{position:absolute;inset:0;background:#05070b center/cover no-repeat;transition:opacity .38s ease;will-change:opacity}
#bgB{opacity:0}
#shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.02) 50%,rgba(0,0,0,.56))}
.character{position:absolute;z-index:6;bottom:-2%;height:82%;width:67%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .24s ease,transform .28s ease,filter .24s ease;filter:drop-shadow(0 10px 22px rgba(0,0,0,.65));pointer-events:none}
#rin{left:-12%;transform:translateX(-4%)}
#akari{right:-12%;transform:translateX(4%)}
.character.show{opacity:1;transform:translateX(0)}
.character.dim{filter:brightness(.58) drop-shadow(0 10px 22px rgba(0,0,0,.65));opacity:.72}
.character.focus{height:90%;filter:brightness(1.05) drop-shadow(0 12px 28px rgba(0,0,0,.7));z-index:7}
#hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.72)}
#chapter{padding:6px 9px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(5,8,15,.35);backdrop-filter:blur(8px)}
#center{position:absolute;z-index:12;left:8%;right:8%;top:50%;transform:translateY(-50%);font-size:23px;line-height:1.72;font-weight:800;text-align:center;white-space:pre-line;text-shadow:0 3px 18px rgba(0,0,0,.95);transition:opacity .18s ease}
#center.term{font-size:27px;letter-spacing:.04em}
#card{position:absolute;z-index:13;left:7%;right:7%;top:69%;padding:12px 14px;text-align:center;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);font-size:15px;font-weight:900;letter-spacing:.06em;text-shadow:0 2px 10px #000;display:none}
#dialog{position:absolute;z-index:15;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:150px;padding:24px 18px 28px;border:1px solid rgba(255,255,255,.17);border-radius:18px;background:linear-gradient(145deg,rgba(5,9,18,.84),rgba(13,17,30,.70));backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);box-shadow:0 12px 35px rgba(0,0,0,.38);display:none}
#name{position:absolute;top:-15px;left:14px;padding:6px 16px;border-radius:999px;background:#f3f4f6;color:#111;font-size:13px;font-weight:900;min-width:58px;text-align:center}
#text{font-size:18px;font-weight:650;line-height:1.65;white-space:pre-line;text-shadow:0 2px 8px #000}
#next{position:absolute;right:14px;bottom:9px;font-size:11px;opacity:.72;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateY(3px);opacity:.28}}
#black{position:absolute;inset:0;z-index:45;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease}
#flash{position:absolute;inset:0;z-index:44;background:radial-gradient(circle,#fff 0,rgba(220,200,255,.95) 20%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none}
#flash.fire{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#title,#end{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#1a2a49,#04060b 65%);padding:26px}
#title h1{font-size:35px;letter-spacing:.14em;margin:0}#title p{opacity:.68;margin:12px 0 40px}
.btn{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:12px 28px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.06)}
#end{display:none;background:rgba(2,4,9,.95)}#end b{font-size:22px;line-height:1.7}
#tap{position:absolute;inset:0;z-index:40;display:none}
@media(min-width:700px){#game{box-shadow:0 0 60px rgba(0,0,0,.65)}}

#bgA.cssLobby,#bgB.cssLobby{
  background-image:
    linear-gradient(180deg,rgba(9,24,38,.08),rgba(4,8,15,.5)),
    radial-gradient(circle at 50% 22%,rgba(104,220,255,.23),transparent 26%),
    linear-gradient(155deg,#20374a 0 32%,#0d1721 33% 52%,#31424b 53% 55%,#111820 56% 100%) !important;
}
#bgA.cssBooth,#bgB.cssBooth{
  background-image:
    radial-gradient(circle at 50% 38%,rgba(117,225,255,.20),transparent 20%),
    linear-gradient(90deg,transparent 49%,rgba(111,221,255,.24) 50%,transparent 51%),
    linear-gradient(180deg,#0b1723,#07101a 45%,#02050a 100%) !important;
}
#statsPanel{
  position:absolute;z-index:14;top:20%;left:8%;right:8%;display:none;
  padding:14px 16px;border:1px solid rgba(130,225,255,.35);
  background:rgba(4,10,18,.62);backdrop-filter:blur(10px);border-radius:15px;
}
.statRow{display:grid;grid-template-columns:70px 1fr 45px;gap:9px;align-items:center;margin:8px 0;font-size:13px}
.statBar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.statFill{height:100%;background:linear-gradient(90deg,#7ee7ff,#d4a6ff);width:45%}
.statRow.voice .statFill{width:88%}.statRow.rhythm .statFill{width:34%}.statRow.aura .statFill{width:58%}
.statRow.emphasis{font-weight:900;text-shadow:0 0 12px rgba(105,225,255,.8)}
#tutorial{
 position:absolute;inset:0;z-index:43;display:none;touch-action:none;
}
#tutorialHeader{
 position:absolute;top:14%;left:7%;right:7%;text-align:center;
 padding:10px 12px;border-radius:12px;background:rgba(2,6,12,.76);
 border:1px solid rgba(255,255,255,.18);font-size:15px;font-weight:800
}
.tnode{
 position:absolute;width:76px;height:76px;transform:translate(-50%,-50%);
 border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 border:2px solid rgba(255,255,255,.78);background:radial-gradient(circle,rgba(255,255,255,.24),rgba(5,11,19,.68));
 font-size:13px;font-weight:900;color:#fff;box-shadow:0 0 22px currentColor;
 pointer-events:none;
}
.tnode.voice{color:#6fe2ff}.tnode.rhythm{color:#ffd16d}.tnode.aura{color:#d29cff}
.tnode.sel{transform:translate(-50%,-50%) scale(1.14);box-shadow:0 0 35px currentColor,0 0 60px currentColor}
#tutorialCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#comboOverlay,#liveStartOverlay{
 position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;text-align:center;
 background:radial-gradient(circle at 50% 45%,rgba(114,220,255,.20),rgba(2,5,10,.5));
}
#comboOverlay .big,#liveStartOverlay .big{font-size:46px;font-weight:1000;letter-spacing:.06em;text-shadow:0 0 24px rgba(130,225,255,.8)}
#comboOverlay .route{margin-top:10px;font-size:18px}
#meterBox{position:absolute;z-index:14;top:16%;right:6%;width:88px;padding:9px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(4,8,15,.6);display:none;text-align:center}
#meterValue{font-size:25px;font-weight:900}


/* --- DEV shortcuts --- */
#debugBtn{
  position:absolute;z-index:58;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 11px;
  background:rgba(0,0,0,.35);color:rgba(255,255,255,.72);font-size:10px;font-weight:800;
}
#debugMenu{
  position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,9,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#debugPanel{
  width:min(88%,360px);padding:18px;border:1px solid rgba(255,255,255,.18);border-radius:18px;
  background:rgba(9,14,25,.94);box-shadow:0 18px 48px rgba(0,0,0,.5)
}
#debugPanel h3{margin:0 0 12px;font-size:15px}
.debugGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.debugJump{
  border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 8px;
  background:rgba(255,255,255,.06);color:#fff;font-size:11px;font-weight:800;text-align:center
}
#debugClose{margin-top:10px;width:100%}

/* Tutorial nodes use the production Existence Wave designs. */
.tnode{
  width:92px!important;height:92px!important;border:none!important;background:none!important;
  box-shadow:none!important;color:transparent!important;
}
.tnode::before{
  content:"";position:absolute;inset:-10px;background:center/contain no-repeat;pointer-events:none;
}
.tnode.voice::before{background-image:url("assets/wave/voice_normal.png")}
.tnode.rhythm::before{background-image:url("assets/wave/rhythm_normal.png")}
.tnode.aura::before{background-image:url("assets/wave/glory_normal.png")}
.tnode.voice.sel::before{background-image:url("assets/wave/voice_active.png")}
.tnode.rhythm.sel::before{background-image:url("assets/wave/rhythm_active.png")}
.tnode.aura.sel::before{background-image:url("assets/wave/glory_active.png")}
.tnode.sel{box-shadow:none!important}

</style>
</head>
<body>
<div id="game">
  <div id="bgA"></div><div id="bgB"></div><div id="shade"></div>
  <img id="rin" class="character" alt=""><img id="akari" class="character" alt="">
  <div id="hud"><span id="chapter">第1章　選ばれし者たち</span><span id="num">01 / 60</span></div>

  <div id="dialog"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>

      <div class="statRow voice"><span>声響</span><div class="statBar"><div class="statFill"></div></div><b>S</b></div>

    <div id="tutorial"><canvas id="tutorialCanvas"></canvas><div id="tutorialHeader"></div></div>

  <button id="debugBtn" type="button">DEBUG</button>
    <div id="debugMenu">
      <div id="debugPanel">
        <h3>DEVELOPMENT MENU</h3>
        <div class="debugGrid">
          <button class="debugJump" data-tap="1">Tap 01<br>最初から</button>
          <button class="debugJump" data-tap="21">Tap 21<br>灯との出会い</button>
          <button class="debugJump" data-tap="41">Tap 41<br>第一次選抜</button>
          <button class="debugJump" data-tap="53">Tap 53<br>COMBO TUTORIAL</button>
          <button class="debugJump" id="debugTutorial">TUTORIAL<br>直接プレイ</button>
          <button class="debugJump" id="debugLive">LIVE<br>本番直接</button>
        </div>
        <button class="debugJump" id="debugClose">CLOSE</button>
      </div>
    </div>
    <div id="tap"></div>
</div>
<script>
const scenes=[{"n": 1, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "かつて人類は、世界から“光”を失った。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 2, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "化石燃料の枯渇。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 3, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "人類は太陽光による、新たなエネルギー時代へ進もうとしていた。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 4, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "だが、その技術を巡って――《エネルギー戦争》が勃発。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 5, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "世界中の巨大ソーラー施設が破壊され、人類は深刻なエネルギー危機に陥った。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 6, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "そんな暗闇の中。日本で、未知のエネルギーが発見される。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 7, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "人間が歌う時にだけ生まれる、光を伴う生命振動。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 8, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "――《存在波（エグジスタンス・ウェーブ）》", "mode": "center", "bg": "assets/bg/bg_dark_city.png", "term": true}, {"n": 9, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "そして、誰よりも強い存在波を放つ一人の少女が現れた。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 10, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "彼女が歌った時、停止していた巨大構造物《陽傘》が、再び動き出した。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 11, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "失われていた空が、都市に戻った。", "mode": "center", "bg": "assets/bg/bg_dark_city.png"}, {"n": 12, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "人々は彼女を――《歌姫（DIVA）》と呼んだ。", "mode": "center", "bg": "assets/bg/bg_dark_city.png", "term": true}, {"n": 13, "section": "世界観プロローグ", "speaker": "ナレーション", "text": "そして今。世界は、新たな歌姫を探している。", "mode": "center", "bg": "assets/bg/bg_dark_city.png", "card": "《ハーモニア計画／第一次選抜》", "transition": "black_hold"}, {"n": 14, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "家族を失った。", "mode": "center", "bg": "assets/event/ev_01.png"}, {"n": 15, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "世界を恨んだ。", "mode": "center", "bg": "assets/event/ev_01.png"}, {"n": 16, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "だから私は、歌った。", "mode": "center", "bg": "assets/event/ev_01.png"}, {"n": 17, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "この世界に――復讐するために。", "mode": "center", "bg": "assets/event/ev_02.png", "flash": true}, {"n": 18, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "存在波を放つことができれば、私は力を手に入れられる。", "mode": "dialog", "bg": "assets/event/ev_03.png"}, {"n": 19, "section": "凛：過去と現在", "speaker": "凛（モノローグ）", "text": "そのために歌ってきた。", "mode": "dialog", "bg": "assets/event/ev_03.png"}, {"n": 20, "section": "凛：過去と現在", "speaker": "凛", "text": "ずっと、一人で。", "mode": "dialog", "bg": "assets/event/ev_03.png", "transition": "black_hold"}, {"n": 21, "section": "光と影の邂逅", "speaker": "灯", "text": "ねえ！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": null, "akariOff": true}, {"n": 22, "section": "光と影の邂逅", "speaker": "灯", "text": "あなたも、オーディション受けに来たの？", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 23, "section": "光と影の邂逅", "speaker": "凛", "text": "……そうだけど", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 24, "section": "光と影の邂逅", "speaker": "灯", "text": "やっぱり！　私も！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 25, "section": "光と影の邂逅", "speaker": "灯", "text": "私ね、DIVAに救ってもらったんだ", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 26, "section": "光と影の邂逅", "speaker": "灯", "text": "だから今度は、私がDIVAになって――", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 27, "section": "光と影の邂逅", "speaker": "灯", "text": "みんなを救いたいの！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "akari"}, {"n": 28, "section": "光と影の邂逅", "speaker": "凛", "text": "…………", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "rin"}, {"n": 29, "section": "光と影の邂逅", "speaker": "凛", "text": "そう。頑張って", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 30, "section": "光と影の邂逅", "speaker": "凛", "text": "それじゃ", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 31, "section": "光と影の邂逅", "speaker": "灯", "text": "えっ、ちょっと待って！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 32, "section": "光と影の邂逅", "speaker": "灯", "text": "せっかく同じオーディション受けるんだから、一緒に行こうよ！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png"}, {"n": 33, "section": "光と影の邂逅", "speaker": "凛", "text": "……なんで？", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "rin"}, {"n": 34, "section": "光と影の邂逅", "speaker": "灯", "text": "なんでって……", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "akari"}, {"n": 35, "section": "光と影の邂逅", "speaker": "灯", "text": "同じところ行くんだから、その方が楽しいじゃん！", "mode": "dialog", "bg": "assets/bg/bg_dark_road.png", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "akari"}, {"n": 36, "section": "光と影の邂逅", "speaker": "凛", "text": "…………", "mode 第一次選抜会場", "speaker": "凛", "text": "歌うだけでしょ", "mode": "dialog", "bg": "css:lobby", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "focus": "rin"}, {"n": 47, "section": "第一次選抜会場", "speaker": "場内アナウンス", "text": "《エントリーNo.017　凛》\n測定ブースへ入室してください", "mode": "dialog", "bg": "css:lobby", "rin": "assets/rin/rin_01.png", "akari": "assets/akari/akari_01.png", "transition": "black_hold"}, {"n": 48, "section": "存在波測定", "speaker": "凛（モノローグ）", "text": "…………", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png"}, {"n": 49, "section": "存在波測定", "speaker": "試験官", "text": "凛さんですね", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png"}, {"n": 50, "section": "存在波測定", "speaker": "試験官", "text": "これから、あなたの歌唱によって発生する存在波を測定します", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "card": "EXISTENCE WAVE"}, {"n": 51, "section": "存在波測定", "speaker": "試験官", "text": "存在波は、主に三つの性質として観測されます", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "stats": true}, {"n": 52, "section": "存在波測定", "speaker": "試験官", "text": "歌声から生じる――《声響》", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "stats": true, "voiceEmphasis": true}, {"n": 53, "section": "COMBO TUTORIAL", "speaker": "試験官", "text": "では、実際にあなたの存在波を測定します", "mode": "liveStart", "bg": "css:booth", "rin": "assets/rin/rin_01.png"}, {"n": 54, "section": "TUTORIAL 01", "speaker": "システム", "text": "SHOUT", "mode": "combo", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "combo": "SHOUT", "route": "声 → 声"}, {"n": 55, "section": "存在波測定", "speaker": "試験官", "text": "……出力上昇", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "meter": 35}, {"n": 56, "section": "TUTORIAL 02", "speaker": "システム", "text": "《SCREAM》を発動してください", "mode": "tutorial2", "bg": "css:booth", "rin": "assets/rin/rin_01.png"}, {"n": 57, "section": "TUTORIAL 02", "speaker": "システム", "text": "SCREAM", "mode": "combo", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "combo": "SCREAM", "route": "声 → 声 → 声"}, {"n": 58, "section": "存在波測定", "speaker": "試験官", "text": "声響値……まだ上がる？", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "meter": 72}, {"n": 59, "section": "存在波測定", "speaker": "凛", "text": "……こんなものじゃない", "mode": "dialog", "bg": "css:booth", "rin": "assets/rin/rin_01.png", "focus": "rin", "meter": 92}, {"n": 60, "section": "LIVE START", "speaker": "システム", "text": "LIVE START", "mode": "liveStart", "bg": "css:booth", "rin": "assets/rin/rin_01.png"}];
let idx=-1,started=false,busy=false,bgFront="A";
const q=id=>document.getElementById(id);
const bgA=q("bgA"),bgB=q("bgB"),rin=q("rin"),akari=q("akari"),center=q("center"),dialog=q("dialog"),black=q("black"),flash=q("flash");

function setBg(url, instant=false){
  const front=bgFront==="A"?bgA:bgB, back=bgFront==="A"?bgB:bgA;
  if(front.dataset.src===url) return;
  back.classList.remove("cssLobby","cssBooth");
  if(url==="css:lobby"){ back.style.backgroundImage=""; back.classList.add("cssLobby"); }
  else if(url==="css:booth"){ back.style.backgroundImage=""; back.classList.add("cssBooth"); }
  else { back.style.backgroundImage=`url("${url}")`; }
  back.dataset.src=url;
  if(instant){front.style.opacity=0;back.style.opacity=1;bgFront=bgFront==="A"?"B":"A";return}
  back.style.opacity=1; front.style.opacity=0; bgFront=bgFront==="A"?"B":"A";
}

function setCharacters(s){
  rin.className="character";akari.className="character";
  if(s.rin){rin.src=s.rin;rin.classList.add("show")}
  if(s.akari){akari.src=s.akari;akari.classList.add("show")}
  if(s.focus==="rin"){rin.classList.add("focus");akari.classList.add("dim")}
  if(s.focus==="akari"){akari.classList.add("focus");rin.classList.add("dim")}
}

function render(s, instant=false){
  q("num").textContent=String(s.n).padStart(2,"0")+" / 60";
  q("chapter").textContent="第1章　"+s.section;
  setBg(s.bg,instant);setCharacters(s);
  center.style.display=s.mode==="center"?"block":"none";
  dialog.style.display=s.mode==="dialog"?"block":"none";
  center.className=s.term?"term":"";
  center.textContent=s.text;
  q("name").textContent=s.speaker||"";
  q("text").textContent=s.text;
  q("card").style.display=s.card?"block":"none";
  q("card").textContent=s.card||"";

  q("statsPanel").style.display=s.stats?"block":"none";
  document.querySelectorAll(".statRow").forEach(x=>x.classList.remove("emphasis"));
  if(s.voiceEmphasis) document.querySelector(".statRow.voice").classList.add("emphasis");

  q("meterBox").style.display=s.meter!=null?"block":"none";
  if(s.meter!=null) q("meterValue").textContent=s.meter;

  q("tutorial").style.display="none";
  q("comboOverlay").style.display="none";
  q("liveStartOverlay").style.display="none";

  if(s.mode==="tutorial1"||s.mode==="tutorial2") startTutorial(s.mode);
  if(s.mode==="combo"){
    q("comboName").textContent=s.combo;
    q("comboRoute").textContent=s.route;
    q("comboOverlay").style.display="flex";
  }
  if(s.mode==="liveStart"){
    q("liveStartText").textContent="TUTORIAL START";
    q("liveStartOverlay").style.display="flex";
    setTimeout(()=>{ window.location.href="live.html?tutorial=1&v=251"; },900);
  }
  if(s.flash){flash.classList.remove("fire");void flash.offsetWidth;flash.classList.add("fire")}
}


let tutNodes=[],tutSelected=[],tutDragging=false,tutMode="",tutCtx=null,tutCanvas=null;

function setupTutorialCanvas(){
  tutCanvas=q("tutorialCanvas");tutCtx=tutCanvas.getContext("2d");
  const r=q("game").getBoundingClientRect();
  tutCanvas.width=r.width*devicePixelRatio;tutCanvas.height=r.height*devicePixelRatio;
  tutCanvas.style.width=r.width+"px";tutCanvas.style.height=r.height+"px";
  tutCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function startTutorial(mode){
  tutMode=mode;tutSelected=[];tutDragging=false;
  const layer=q("tutorial");layer.style.display="block";
  [...layer.querySelectorAll(".tnode")].forEach(n=>n.remove());
  q("tutorialHeader").textContent=mode==="tutorial1" ? "《声響》を2つ、指でなぞれ" : "《SCREAM》　声 → 声 → 声";
  const defs= mode==="tutorial1"
    ? [["voice",27,43],["voice",62,34],["voice",72,62],["voice",35,69]]
    : [["voice",20,41],["rhythm",48,31],["voice",73,42],["aura",35,68],["voice",69,70]];
  defs.forEach((d,i)=>{
    const n=document.createElement("div");n.className="tnode "+d[0];n.dataset.type=d[0];
    n.style.left=d[1]+"%";n.style.top=d[2]+"%";
    n.innerHTML=d[0]==="voice"?"声響":d[0]==="rhythm"?"律動":"華耀";
    layer.appendChild(n);tutNodes.push(n);
  });
  setupTutorialCanvas();drawTutorialLine();
}
function tutPos(cx,cy){const r=q("game").getBoundingClientRect();return{x:cx-r.left,y:cy-r.top}}
function tutCenter(el){const g=q("game").getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-g.left+r.width/2,y:r.top-g.top+r.height/2}}
function tutHit(p){
  return tutNodes.find(n=>{const c=tutCenter(n);return Math.hypot(p.x-c.x,p.y-c.y)<46});
}
function tutAdd(n){
  if(!n||tutSelected.includes(n))return;
  tutSelected.push(n);n.classList.add("sel");drawTutorialLine();
}
function drawTutorialLine(temp){
  if(!tutCtx)return;
  const r=q("game").getBoundingClientRect();tutCtx.clearRect(0,0,r.width,r.height);
  if(!tutSelected.length)return;
  const pts=tutSelected.map(tutCenter);if(temp)pts.push(temp);
  tutCtx.save();tutCtx.lineCap="round";tutCtx.lineJoin="round";
  tutCtx.strokeStyle="rgba(115,225,255,.28)";tutCtx.lineWidth=15;tutCtx.shadowColor="#b996ff";tutCtx.shadowBlur=22;
  tutCtx.beginPath();pts.forEach((p,i)=>i?tutCtx.lineTo(p.x,p.y):tutCtx.moveTo(p.x,p.y));tutCtx.stroke();
  tutCtx.strokeStyle="#e9fbff";tutCtx.lineWidth=4;tutCtx.shadowBlur=12;
  tutCtx.beginPath();pts.forEach((p,i)=>i?tutCtx.lineTo(p.x,p.y):tutCtx.moveTo(p.x,p.y));tutCtx.stroke();tutCtx.restore();
}
function tutorialSuccess(){
  const types=tutSelected.map(n=>n.dataset.type);
  const ok=tutMode==="tutorial1"
    ? types.length>=2 && types[0]==="voice" && types[1]==="voice"
    : types.length>=3 && types[0]==="voice" && types[1]==="voice" && types[2]==="voice";
  if(ok){
    q("tutorial").style.display="none";
    idx++; render(scenes[idx]);
  }else{
    tutSelected.forEach(n=>n.classList.remove("sel"));tutSelected=[];drawTutorialLine();
    q("tutorialHeader").textContent="もう一度。正しい順番でなぞしてください";
  }
}
const tutLayer=q("tutorial");
tutLayer.addEventListener("pointerdown",e=>{
  if(!tutMode)return;e.preventDefault();tutDragging=true;tutAdd(tutHit(tutPos(e.clientX,e.clientY)));
});
window.addEventListener("pointermove",e=>{
  if(!tutDragging)return;e.preventDefault();const p=tutPos(e.clientX,e.clientY);tutAdd(tutHit(p));drawTutorialLine(p);
},{passive:false});
window.addEventListener("pointerup",e=>{
  if(!tutDragging)return;e.preventDefault();tutDragging=false;drawTutorialLine();tutorialSuccess();
},{passive:false});

function blackTransition(nextScene){
  busy=true;black.style.opacity=1;
  setTimeout(()=>{render(nextScene,true)},380);
  setTimeout(()=>{black.style.opacity=0},1180);
  setTimeout(()=>{busy=false},1510);
}

function startGame(){
  if(started)return;
  started=true;
  q("title").style.display="none";
  q("tap").style.display="block";
  idx=0;
  render(scenes[idx],true);
}

function advance(){
  if(busy||!started||q("tutorial").style.display==="block")return;
  if(idx>=scenes.length-1){
    q("end").style.display="flex";
    return;
  }
  const current=scenes[idx], next=scenes[idx+1];
  idx++;
  if(current.transition==="black_hold") blackTransition(next);
  else render(next);
}


function jumpToTap(tapNo){
  started=true;busy=false;
  q("title").style.display="none";
  q("end").style.display="none";
  q("debugMenu").style.display="none";
  q("tap").style.display="block";
  idx=Math.max(0,Math.min(scenes.length-1,tapNo-1));
  render(scenes[idx],true);
}
q("debugBtn").addEventListener("click",e=>{
  e.stopPropagation();q("debugMenu").style.display="flex";
});
q("debugMenu").addEventListener("click",e=>e.stopPropagation());
q("debugClose").addEventListener("click",()=>q("debugMenu").style.display="none");
document.querySelectorAll("[data-tap]").forEach(btn=>{
  btn.addEventListener("click",()=>jumpToTap(Number(btn.dataset.tap)));
});
q("debugTutorial").addEventListener("click",()=>{window.location.href="live.html?tutorial=1&v=251";});
q("debugLive").addEventListener("click",()=>{window.location.href="live.html?v=251";});

q("title").addEventListener("click",startGame);
q("title").addEventListener("touchend",e=>{
  e.preventDefault();
  startGame();
},{passive:false});

q("tap").addEventListener("click",advance);
q("tap").addEventListener("touchend",e=>{
  e.preventDefault();
  advance();
},{passive:false});
</script>
