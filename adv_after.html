<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SONG FOR LIFE / AFTER LIVE v25.6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#game{position:relative;width:100%;height:100%;max-width:430px;margin:auto;overflow:hidden;background:#03050a;user-select:none}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(90,145,185,.22),transparent 28%),linear-gradient(180deg,#121d29,#070d15 55%,#020408);z-index:0;background-size:cover;background-position:center}
#bg.result{background:radial-gradient(circle at 50% 20%,rgba(110,205,255,.18),transparent 26%),linear-gradient(155deg,#1a2c3a,#09111a 60%,#03060b)}
#bg.booth{background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.24)),url("assets/bg/bg_ad_road.png");background-size:cover;background-position:center}
#shade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.03) 48%,rgba(0,0,0,.68))}
.char{position:absolute;z-index:5;bottom:-1%;height:88%;width:92%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .65s ease,filter .25s;filter:drop-shadow(0 16px 34px rgba(0,0,0,.85));pointer-events:none}
.char.show{opacity:1}
.char.dim{filter:brightness(.48) drop-shadow(0 16px 34px rgba(0,0,0,.85));opacity:.6}
#mina{left:4%;height:91%;width:92%}
#rin{left:-19%;width:72%;height:81%}
#akari{right:-19%;width:72%;height:81%}
#dialog{position:absolute;z-index:16;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:158px;padding:25px 18px 29px;border:1px solid rgba(255,255,255,.18);border-radius:18px;background:linear-gradient(145deg,rgba(4,8,16,.91),rgba(15,18,29,.78));backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.48)}
#name{position:absolute;top:-16px;left:15px;padding:6px 17px;border-radius:999px;background:#f2f3f5;color:#101116;font-size:14px;font-weight:900;min-width:64px;text-align:center}
#text{font-size:19px;font-weight:680;line-height:1.7;white-space:pre-line;text-shadow:0 2px 9px #000}
#next{position:absolute;right:15px;bottom:9px;font-size:11px;opacity:.65;animation:pulse 1s infinite}@keyframes pulse{50%{transform:translateY(3px);opacity:.25}}
#black{position:absolute;inset:0;z-index:50;background:#000;opacity:1;transition:opacity .75s ease;pointer-events:none}
#center{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(0,0,0,.76);font-size:20px;font-weight:900;line-height:1.8;letter-spacing:.05em}
#center .small{font-size:11px;letter-spacing:.18em;opacity:.6;margin-bottom:12px}
#end{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 37%,#17263d,#020409 68%);padding:25px}
#end .kicker{font-size:11px;letter-spacing:.24em;opacity:.55;margin-bottom:14px}
#end .title{font-size:29px;font-weight:900;letter-spacing:.13em}
#end .sub{font-size:13px;line-height:1.8;opacity:.65;margin-top:18px}
#tap{position:absolute;inset:0;z-index:40}


/* v25.4 AFTER LIVE */
#mina.bust{
  left:4%!important;right:auto!important;width:92%!important;height:91%!important;
}
#mina.pair{
  left:auto!important;right:-17%!important;width:72%!important;height:81%!important;
}
#rin.minaPair{
  left:-17%!important;width:72%!important;height:81%!important;
}
#end .candidateLabel{
  margin-top:32px;font-size:14px;font-weight:800;letter-spacing:.08em;opacity:.78;line-height:1.65;
}
#end .candidateName{
  margin-top:8px;font-size:86px;font-weight:1000;line-height:1;
  letter-spacing:.08em;text-shadow:0 0 28px rgba(135,220,255,.30);
}


/* v25.5 BLACK DIALOG FIX
   Blackout hides BG/characters, but dialogue remains visible above it. */
#black{z-index:50!important}
#dialog{z-index:55!important}
#center{z-index:56!important}
#tap{z-index:70!important}

</style>
</head>
<body>
<div id="game">
 <div id="bg"></div><div id="shade"></div>
 <img id="mina" class="char" src="assets/mina/mina_02.png">
 <img id="rin" class="char" src="assets/rin/rin_01.png">
 <img id="akari" class="char" src="assets/akari/akari_01.png">
 <div id="dialog"><div id="name"></div><div id="text"></div><div id="next">TAP ▾</div></div>
 <div id="center"></div>
 <div id="black"></div>
 <div id="end"><div><div class="kicker">SONG FOR LIFE</div><div class="title">PROLOGUE END</div><div class="candidateLabel">ハーモニア計画・歌姫候補生</div><div class="candidateName">凛</div></div></div>
 <div id="tap"></div>
</div>
<script>
const q=id=>document.getElementById(id),mina=q("mina"),rin=q("rin"),akari=q("akari"),bg=q("bg"),dialog=q("dialog"),black=q("black"),center=q("center");
const scenes=[
 {sp:"試験官",tx:"すさまじい存在波です…！！",black:true},
 {sp:"凛",tx:"……私に、世界と戦える力は、ある？",booth:true,rinSolo:true,focus:"rin"},
 {sp:"？？？",tx:"ええ",booth:true,voiceOnly:true},
 {sp:"Mina",tx:"あなたなら、抗えるわ",booth:true,mina:"bust"},
 {sp:"Mina",tx:"この世界と",booth:true,minaPair:true,focus:"mina"},
 {sp:"凛",tx:"……そう",booth:true,minaPair:true,focus:"rin"},
 {sp:"凛",tx:"なら、それでいい",booth:true,minaPair:true,focus:"rin"},
 {card:"《 第一次選抜　通過 》\n\n《ハーモニア計画・歌姫候補生　凛》"},
 {sp:"灯",tx:"凛！",pair:true},
 {sp:"灯",tx:"あなたも選ばれたのね！",pair:true},
 {sp:"灯",tx:"一緒に、世界を救おう！",pair:true,focus:"akari"},
 {sp:"凛",tx:"……救う？",pair:true,focus:"rin"},
 {sp:"凛",tx:"私は、この世界に抗うんだ",pair:true,focus:"rin"},
 {end:true}
];
let i=0,locked=true;
function hideAll(){
  mina.className="char";rin.className="char";akari.className="char";
}
function render(){
 const s=scenes[i];
 center.style.display="none";
 dialog.style.display="none";
 bg.classList.remove("booth","result");

 if(s.end){
   hideAll(); black.style.opacity=1;
   setTimeout(()=>q("end").style.display="flex",700); return;
 }
 if(s.card){
   hideAll(); black.style.opacity=0; bg.classList.add("result");
   center.innerHTML='<div><div class="small">FIRST AUDITION RESULT</div>'+s.card.replace(/\n/g,"<br>")+'</div>';
   center.style.display="flex"; return;
 }

 if(s.booth) bg.classList.add("booth");

 if(s.black){
   hideAll(); black.style.opacity=1;
 }else{
   black.style.opacity=0; hideAll();

   if(s.rinSolo){
     rin.src="assets/rin/rin_01.png";
     rin.className="char show";
   }
   if(s.voiceOnly){
     // Mina is heard but not yet revealed.
   }
   if(s.mina==="bust"){
     mina.src="assets/mina/mina_02.png";
     mina.className="char bust show";
   }
   if(s.minaPair){
     rin.src="assets/rin/rin_01.png";
     mina.src="assets/mina/mina_01.png";
     rin.className="char minaPair show";
     mina.className="char pair show";
   }
   if(s.pair){
     rin.src="assets/rin/rin_01.png";
     akari.src="assets/akari/akari_01.png";
     rin.className="char show";
     akari.className="char show";
     bg.classList.add("result");
   }
 }

 q("name").textContent=s.sp||"";
 q("text").textContent=s.tx||"";
 dialog.style.display="block";

 if(s.focus==="rin"){
   rin.classList.remove("dim");
   if(s.minaPair) mina.classList.add("dim");
   if(s.pair) akari.classList.add("dim");
 }else if(s.focus==="mina"){
   mina.classList.remove("dim");
   rin.classList.add("dim");
 }else if(s.focus==="akari"){
   akari.classList.remove("dim");
   rin.classList.add("dim");
 }
}
function next(){if(locked)return;i=Math.min(i+1,scenes.length-1);render()}
q("tap").addEventListener("click",next);
render();setTimeout(()=>locked=false,850);
</script>
</body></html>
