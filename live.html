<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HARMONIA LIVE v20</title>
<style>
:root {
  --glass:rgba(8,12,24,.48);
  --line:rgba(255,255,255,.16);
  --text:#fff;
  --muted:rgba(255,255,255,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#050812;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;touch-action:none;overscroll-behavior:none;
}
button{font:inherit}
#app{width:100%;height:100%;background:#050812}
#game{
  position:relative;width:100%;height:100%;
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  background:#050812;
}
#liveBg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center center;
  z-index:0;pointer-events:none;
}
#videoShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(2,5,12,.34) 0%,rgba(2,5,12,.05) 22%,rgba(2,5,12,.02) 62%,rgba(2,5,12,.46) 100%),
    radial-gradient(circle at 50% 45%,transparent 0 50%,rgba(2,5,12,.15) 100%);
}
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#topHud{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  z-index:30;
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:7px;
  align-items:start;
  pointer-events:none;
}
#stageInfo{border-radius:14px;padding:8px 10px;min-width:0}
.hudRow{display:flex;justify-content:space-between;gap:8px;align-items:center}
#turnLabel{font-size:14px;font-weight:800}
#difficulty{font-size:9px;color:var(--muted)}
#themeName{font-size:12px;font-weight:700;margin-top:2px}
#themeDesc{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoreHud,#timerBox{
  border-radius:14px;padding:7px 9px;text-align:center;min-width:68px;
}
.hudLabel{font-size:8px;color:var(--muted);letter-spacing:.08em}
#score{font-size:16px;font-weight:800;margin-top:1px}
#countdown{font-size:29px;font-weight:900;line-height:1;margin-top:2px}
#audienceHud{
  position:absolute;
  left:max(10px,env(safe-area-inset-left));
  top:108px;z-index:30;
  border-radius:999px;padding:6px 9px;
  display:flex;gap:8px;align-items:center;
  font-size:9px;pointer-events:none;
}
#audienceHud b{font-size:12px}
#lineLayer{position:absolute;inset:0;z-index:8;pointer-events:none}
#nodeLayer{position:absolute;inset:0;z-index:12;pointer-events:none}
.node{
  position:absolute;width:78px;height:78px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.76);
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.24),rgba(9,14,27,.56));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:800;
  box-shadow:0 0 18px currentColor,inset 0 0 20px rgba(255,255,255,.10);
  pointer-events:none;
}
.node .icon{font-size:26px;line-height:1;margin-bottom:2px}
.node small{font-size:8px;opacity:.82}
.node.vocal{color:#69ddff}
.node.expression{color:#ff72c0}
.node.dance{color:#ffd76e}
.node.control{color:#8cf6ae}
.node.resonance{color:#c4a2ff}
.node.sel{
  transform:translate(-50%,-50%) scale(1.12);
  box-shadow:0 0 30px currentColor,0 0 55px currentColor;
}
#touchSurface{
  position:absolute;inset:0;z-index:25;
  background:transparent;pointer-events:auto;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
#comboDock{
  position:absolute;
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  bottom:calc(max(10px,env(safe-area-inset-bottom)) + 10px);
  z-index:31;border-radius:16px;padding:8px 8px 9px;
  pointer-events:none;
}
.comboTitle{
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;color:var(--muted);letter-spacing:.05em;
}
#selectedCount{color:#fff;font-weight:700}
.recipeRow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.recipe{
  background:rgba(13,18,34,.45);
  border:1px solid rgba(255,255,255,.10);
  border-radius:11px;padding:5px 4px;text-align:center;
}
.recipeName{font-size:7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipeSeq{font-size:15px;margin-top:2px;white-space:nowrap}
#resetBtn{
  position:absolute;
  right:max(12px,env(safe-area-inset-right));
  top:132px;z-index:35;
  border:1px solid var(--line);
  background:rgba(8,12,24,.48);
  color:#fff;border-radius:999px;
  padding:6px 10px;font-size:9px;font-weight:700;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:auto;
}
#dragHint{
  position:absolute;left:50%;bottom:125px;
  transform:translateX(-50%);
  z-index:18;background:rgba(4,8,18,.48);
  border:1px solid var(--line);border-radius:999px;
  padding:5px 9px;font-size:9px;color:rgba(255,255,255,.82);
  white-space:nowrap;pointer-events:none;
}
.centerOverlay{
  position:absolute;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(3,6,14,.26);
  backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
  pointer-events:none;
}
#preCountdown{
  font-size:104px;font-weight:900;
  text-shadow:0 0 30px rgba(255,255,255,.35);
}
#performanceInner{width:100%;padding:0 20px}
#performance .move{
  font-size:30px;font-weight:900;line-height:1.05;
  text-shadow:0 0 18px rgba(255,92,168,.65);
}
#gainScore{
  font-size:58px;font-weight:900;line-height:1;
  margin-top:10px;
  text-shadow:0 0 20px rgba(255,92,168,.85),0 0 38px rgba(104,223,255,.45);
}
#performance .route{font-size:11px;color:rgba(255,255,255,.82);margin-top:8px}
@media (min-width:700px){
  #game{max-width:430px;margin:0 auto}
}

#cutinOverlay{
  background:rgba(0,0,0,.08);
  overflow:hidden;
  pointer-events:none;
}
#cutinVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}
#cutinScoreBox{
  position:absolute;
  left:0;right:0;bottom:8%;
  z-index:3;
  text-align:center;
  padding:16px 18px 18px;
  background:linear-gradient(180deg,transparent,rgba(4,6,14,.72));
  text-shadow:0 0 18px rgba(0,0,0,.8);
}
#cutinMoveName{
  font-size:20px;
  font-weight:900;
  letter-spacing:.06em;
}
#cutinGainScore{
  font-size:58px;
  line-height:1;
  font-weight:900;
  margin-top:8px;
}
#cutinRoute{
  margin-top:8px;
  font-size:11px;
  color:rgba(255,255,255,.86);
}
#finalScoreOverlay{
  z-index:80;
  background:rgba(3,5,12,.74);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#finalScoreInner{
  width:100%;
  text-align:center;
  padding:24px;
}
#finalScoreLabel{
  font-size:18px;
  font-weight:800;
  letter-spacing:.18em;
  opacity:.82;
}
#finalScoreValue{
  margin-top:14px;
  font-size:72px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.03em;
  text-shadow:0 0 26px rgba(255,255,255,.25);
}
#finalScoreSub{
  margin-top:16px;
  font-size:20px;
  font-weight:900;
}


.node.medium{width:70px;height:70px;font-size:11px}
.node.medium .icon{font-size:23px}
.node.compact{width:64px;height:64px;font-size:10px}
.node.compact .icon{font-size:21px}
.node.compact small{font-size:7px}
#waveFlash{
  position:absolute;inset:0;z-index:70;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,1) 0%,rgba(210,235,255,.96) 18%,rgba(205,165,255,.65) 45%,rgba(255,255,255,0) 76%);
  mix-blend-mode:screen;
}
#waveFlash.fire{animation:waveFlash .28s ease-out both}
@keyframes waveFlash{
  0%{opacity:0}
  32%{opacity:1}
  100%{opacity:0}
}


/* --- Three Existence Wave attributes --- */
.node{
  border:none!important;background:none!important;box-shadow:none!important;
  width:92px!important;height:92px!important;color:transparent!important;
}
.node::before{
  content:"";position:absolute;inset:-9px;background:center/contain no-repeat;pointer-events:none;
}
.node.voice::before{background-image:url("assets/wave/voice_normal.png")}
.node.rhythm::before{background-image:url("assets/wave/rhythm_normal.png")}
.node.glory::before{background-image:url("assets/wave/glory_normal.png")}
.node.voice.sel::before{background-image:url("assets/wave/voice_active.png")}
.node.rhythm.sel::before{background-image:url("assets/wave/rhythm_active.png")}
.node.glory.sel::before{background-image:url("assets/wave/glory_active.png")}
.node.medium{width:82px!important;height:82px!important}
.node.compact{width:72px!important;height:72px!important}
.node .icon,.node>div,.node small{display:none!important}
.recipeRow{grid-template-columns:repeat(4,1fr)!important}
.recipe{transition:.16s;position:relative}
.recipeSeq{font-size:13px!important;letter-spacing:0!important}
.recipe.possible{border-color:rgba(120,220,255,.42);box-shadow:0 0 10px rgba(100,210,255,.18)}
.recipe.matched{
  border-color:rgba(255,235,145,.85);background:rgba(100,75,20,.42);
  box-shadow:0 0 16px rgba(255,210,80,.48)
}
.recipe.matched::after{
  content:"✓";position:absolute;right:4px;top:2px;font-size:11px;font-weight:900;color:#ffe37d
}
#noComboOverlay{
  position:absolute;inset:0;z-index:72;display:none;align-items:center;justify-content:center;
  pointer-events:none;background:rgba(3,5,12,.18)
}
#noComboOverlay div{padding:10px 18px;border-radius:999px;background:rgba(3,6,13,.68);font-weight:900}
#finalScoreOverlay{pointer-events:auto!important}
#retryLive{
  margin-top:22px;border:1px solid rgba(255,255,255,.35);border-radius:999px;
  background:rgba(255,255,255,.08);color:#fff;padding:11px 24px;font-weight:900
}


.comboWave{
  width:26px;height:26px;object-fit:contain;display:block;flex:0 0 auto;
  filter:drop-shadow(0 0 5px rgba(120,210,255,.35));
}
.recipeSeq{
  display:flex!important;align-items:center;justify-content:center;gap:2px;
  min-width:0;overflow:visible!important;
}
.recipeSeq span{font-size:12px;color:rgba(255,255,255,.55);line-height:1}
.recipe.matched .comboWave{filter:drop-shadow(0 0 9px rgba(255,224,110,.95)) brightness(1.18)}
.recipe.possible .comboWave{filter:drop-shadow(0 0 7px rgba(120,220,255,.75))}
#uiVariantTag{
  position:absolute;z-index:38;right:10px;top:124px;
  padding:4px 8px;border-radius:999px;background:rgba(4,7,14,.55);
  border:1px solid rgba(255,255,255,.14);font-size:8px;font-weight:900;letter-spacing:.08em;
  pointer-events:none;
}


/* UI A: right-top vertical cards */
#comboDock{
  left:auto!important;right:8px!important;top:156px!important;bottom:auto!important;
  width:154px!important;padding:7px!important;border-radius:14px!important;
  background:rgba(7,11,21,.60)!important;
}
#comboDock .comboTitle{font-size:8px!important;margin-bottom:5px}
#comboDock .recipeRow{grid-template-columns:1fr!important;gap:5px!important;margin-top:4px!important}
#comboDock .recipe{
  min-height:48px!important;padding:5px 6px!important;border-radius:10px!important;
  display:grid!important;grid-template-columns:52px 1fr!important;align-items:center!important;
}
#comboDock .recipeName{text-align:left!important;font-size:7px!important}
#comboDock .recipeSeq{justify-content:flex-start!important}
#comboDock .comboWave{width:23px;height:23px}
#dragHint{bottom:18px!important}


/* v20 BASE UI: compact top / free playfield / bottom combo deck */
#topHud{
 top:max(7px,env(safe-area-inset-top))!important;
 left:max(7px,env(safe-area-inset-left))!important;
 right:max(7px,env(safe-area-inset-right))!important;
 grid-template-columns:minmax(0,1fr) 64px 58px!important;gap:5px!important;align-items:stretch!important;
}
#stageInfo{padding:5px 8px!important;border-radius:11px!important;min-height:42px!important}
#turnLabel{font-size:11px!important} #difficulty{font-size:7px!important}
#themeName{font-size:9px!important;margin-top:0!important;display:inline!important}
#themeDesc{display:none!important}
#scoreHud,#timerBox{padding:4px 5px!important;min-width:0!important;border-radius:11px!important}
.hudLabel{font-size:6.5px!important} #score{font-size:12px!important} #countdown{font-size:22px!important}
#audienceHud{top:58px!important;left:max(8px,env(safe-area-inset-left))!important;padding:4px 7px!important;font-size:7px!important}
#audienceHud b{font-size:10px!important}
#resetBtn{top:57px!important;right:max(8px,env(safe-area-inset-right))!important;padding:4px 8px!important;font-size:7px!important;opacity:.72}
#comboDock{
 left:max(7px,env(safe-area-inset-left))!important;right:max(7px,env(safe-area-inset-right))!important;
 top:auto!important;bottom:max(7px,env(safe-area-inset-bottom))!important;width:auto!important;
 padding:5px 7px 6px!important;border-radius:13px!important;background:rgba(7,11,21,.67)!important;
}
#comboDock .comboTitle{display:none!important}
#comboDock .recipeRow{display:grid!important;grid-template-columns:1fr!important;gap:2px!important;margin:0!important}
#comboDock .recipe{
 min-height:0!important;height:29px!important;padding:1px 5px!important;border-radius:7px!important;
 display:grid!important;grid-template-columns:76px 1fr!important;align-items:center!important;
 background:rgba(13,18,34,.34)!important;border:1px solid rgba(255,255,255,.065)!important;
}
#comboDock .recipeName{text-align:left!important;font-size:7px!important;letter-spacing:.04em!important;padding-left:3px}
#comboDock .recipeSeq{justify-content:flex-start!important;gap:2px!important;margin:0!important}
#comboDock .comboWave{width:23px!important;height:23px!important}
#comboDock .recipeSeq span{font-size:10px!important}
#dragHint{bottom:143px!important;font-size:7px!important;padding:3px 7px!important;opacity:.78}
/* keep the entire central interaction field visually clean */

</style>
</head>
<body>
<div id="app">
  <div id="game">
    <video id="liveBg" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="play_bg.mp4" type="video/mp4">
    </video>
    <div id="videoShade"></div>

    <div id="topHud">
      <div id="stageInfo" class="glass">
        <div class="hudRow">
          <span id="turnLabel">TURN 1 / 6</span>
          <span id="difficulty">STATIC</span>
        </div>
        <div id="themeName">静寂の導入</div>
        <div id="themeDesc">VOCAL系を含むルートが高得点</div>
      </div>
      <div id="scoreHud" class="glass">
        <div class="hudLabel">SCORE</div>
        <div id="score">0</div>
      </div>
      <div id="timerBox" class="glass">
        <div class="hudLabel">TIME</div>
        <div id="countdown">7</div>
      </div>
    </div>

    
    <div id="audienceHud" class="glass">
      <span>AUDIENCE</span><b id="audience">20%</b>
    </div>

    <canvas id="lineLayer"></canvas>
    <div id="nodeLayer"></div>
    <div id="touchSurface" aria-label="スキル選択エリア"></div>

    <div id="comboDock" class="glass">
      <div class="comboTitle">
        <span>RIN / COMBO SET</span>
        <span id="selectedCount">0 CHAIN</span>
      </div>
      <div class="recipeRow">
        <div class="recipe" data-recipe="SHOUT">
          <div class="recipeName">SHOUT</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""></div>
        </div>
        <div class="recipe" data-recipe="SCREAM">
          <div class="recipeName">SCREAM</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""></div>
        </div>
        <div class="recipe" data-recipe="BREAK BEAT">
          <div class="recipeName">BREAK BEAT</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave rhythm" src="assets/wave/rhythm_normal.png" alt=""></div>
        </div>
        <div class="recipe" data-recipe="HOWLING">
          <div class="recipeName">HOWLING</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave glory" src="assets/wave/glory_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""></div>
        </div>
      </div>
    </div>

    <div id="noComboOverlay"><div>NO COMBO</div></div>

    <button id="resetBtn" type="button">RESET</button>
    <div id="dragHint">スキルを見つけて一筆書き　指を離すと即決定</div>

    <div id="preCountdown" class="centerOverlay">3</div>
    <div id="waveFlash"></div>

    <div id="cutinOverlay" class="centerOverlay">
      <video id="cutinVideo" muted playsinline preload="auto"></video>
      <div id="cutinScoreBox">
        <div id="cutinMoveName">PERFORMANCE</div>
        <div id="cutinGainScore">+0</div>
        <div id="cutinRoute"></div>
      </div>
    </div>

    <div id="finalScoreOverlay" class="centerOverlay">
      <div id="finalScoreInner">
        <div id="finalScoreLabel">FINAL SCORE</div>
        <div id="finalScoreValue">0</div>
        <div id="finalScoreSub">LIVE CLEAR</div><button id="retryLive" type="button">RETRY LIVE</button>
      </div>
    </div>
  </div>
</div>
<script>


const liveBg=document.getElementById("liveBg");
function keepLiveVideoPlaying(){
  if(!liveBg) return;
  const p=liveBg.play();
  if(p && typeof p.catch==="function") p.catch(()=>{});
}

const skills=[
  {name:"声響",type:"voice"},
  {name:"声響",type:"voice"},
  {name:"声響",type:"voice"},
  {name:"律動",type:"rhythm"},
  {name:"律動",type:"rhythm"},
  {name:"華耀",type:"glory"}
];
const recipes=[
  {seq:["voice","voice"],name:"SHOUT",mult:1.35},
  {seq:["voice","voice","voice"],name:"SCREAM",mult:1.75},
  {seq:["voice","voice","rhythm"],name:"BREAK BEAT",mult:1.65},
  {seq:["voice","glory","voice"],name:"HOWLING",mult:1.80}
];
const themes=[
  {name:"声響増幅",desc:"《声響》を中心にコンボを組め",type:"voice",mult:1.55},
  {name:"律動干渉",desc:"《律動》を経由する複合コンボが有効",type:"rhythm",mult:1.45},
  {name:"華耀共鳴",desc:"《華耀》を含むルートで存在波が輝く",type:"glory",mult:1.45},
  {name:"声響増幅",desc:"凛の声を途切れさせるな",type:"voice",mult:1.65},
  {name:"複合共鳴",desc:"複数コンボを一本のルートに仕込め",type:"any",mult:1.55},
  {name:"臨界声響",desc:"最長ルートで最大出力を狙え",type:"voice",mult:1.85}
];

const game=document.getElementById("game");
const nodeLayer=document.getElementById("nodeLayer");
const canvas=document.getElementById("lineLayer");
const ctx=canvas.getContext("2d");
const resetBtn=document.getElementById("resetBtn");
const cutinOverlay=document.getElementById("cutinOverlay");
const cutinVideo=document.getElementById("cutinVideo");
const finalScoreOverlay=document.getElementById("finalScoreOverlay");
const waveFlash=document.getElementById("waveFlash");

let turn=0,score=0,audience=20,active=false,time=7,timer=null;
let currentNodes=[],drawn=[],dragging=false;
let lastMoveTime=performance.now();

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}

function resizeCanvas(){
  const r=game.getBoundingClientRect();
  canvas.width=r.width*devicePixelRatio;
  canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+"px";
  canvas.style.height=r.height+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  drawLines();
}
addEventListener("resize",resizeCanvas);

function randomPoints(count){
  const pts=[];let tries=0;
  while(pts.length<count&&tries<400){
    tries++;
    const p={x:11+Math.random()*78,y:11+Math.random()*66};
    const minDist=count>=9?12.5:(count>=8?14:16);
    const ok=pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>minDist);
    if(ok)pts.push(p);
  }
  while(pts.length<count)pts.push({x:13+Math.random()*74,y:12+Math.random()*64});
  return pts;
}

function setTheme(){
  const t=themes[turn];
  document.getElementById("turnLabel").textContent=`TURN ${turn+1} / 6`;
  document.getElementById("themeName").textContent=t.name;
  document.getElementById("themeDesc").textContent=t.desc;
  document.getElementById("difficulty").textContent=turn<5?"STATIC":"MOVING";
}

function spawn(){
  nodeLayer.innerHTML="";
  drawn=[];currentNodes=[];
  document.getElementById("selectedCount").textContent="0 CHAIN";
  document.querySelectorAll(".recipe").forEach(x=>x.classList.remove("possible","matched"));
  const nodeCounts=[6,7,8,8,9,10];
  const nodeCount=nodeCounts[turn]||10;
  const pool=[];
  while(pool.length<nodeCount){ pool.push(...shuffled(skills)); }
  const picks=pool.slice(0,nodeCount);
  const pts=randomPoints(nodeCount);

  picks.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className=`node ${s.type}`;
    if(nodeCount>=9) el.classList.add("compact");
    else if(nodeCount>=8) el.classList.add("medium");
    el.style.left=pts[i].x+"%";
    el.style.top=pts[i].y+"%";
    el.innerHTML="";
    el.dataset.name=s.name;
    el.dataset.type=s.type;

    // Normal play is static. Only the last 3 turns move, and slowly.
    const moving=turn>=5;
    el.dataset.moving=moving?"1":"0";
    const speed=moving?(0.004+(turn-5)*0.0025):0;
    const a=Math.random()*Math.PI*2;
    el._vx=Math.cos(a)*speed;
    el._vy=Math.sin(a)*speed;
    el._px=pts[i].x;el._py=pts[i].y;

    nodeLayer.appendChild(el);
    currentNodes.push(el);
  });
  resizeCanvas();
}

function nodeCenter(el){
  const gr=game.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-gr.left+r.width/2,y:r.top-gr.top+r.height/2}
}
function drawLines(temp){
  const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  if(!drawn.length)return;

  const pts=drawn.map(nodeCenter);
  if(temp) pts.push(temp);
  if(pts.length<2)return;

  // Core luminous "existence wave"
  const grad=ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"rgba(110,225,255,.98)");
  grad.addColorStop(.45,"rgba(220,160,255,.98)");
  grad.addColorStop(1,"rgba(255,235,150,.98)");

  ctx.save();
  ctx.lineCap="round";ctx.lineJoin="round";

  // broad aura
  ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle="rgba(190,150,255,.28)";
  ctx.lineWidth=15;
  ctx.shadowColor="rgba(180,125,255,.95)";
  ctx.shadowBlur=24;
  ctx.stroke();

  // bright core
  ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle=grad;
  ctx.lineWidth=4.5;
  ctx.shadowColor="rgba(125,225,255,.95)";
  ctx.shadowBlur=12;
  ctx.stroke();

  // sparkling particles distributed along the traced route
  const now=performance.now()/180;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const len=Math.hypot(b.x-a.x,b.y-a.y);
    const count=Math.max(2,Math.floor(len/24));
    for(let j=0;j<count;j++){
      const t=(j/count + (now*.045))%1;
      const x=a.x+(b.x-a.x)*t;
      const y=a.y+(b.y-a.y)*t;
      const pulse=.55+.45*Math.sin(now+j*1.7+i);
      const r=1.2+2.0*pulse;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.55+.4*pulse})`;
      ctx.shadowColor="rgba(220,190,255,1)";
      ctx.shadowBlur=10;
      ctx.fill();
    }
  }
  ctx.restore();
}function localPos(e){
  const r=game.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function hitNode(pos){
  const gr=game.getBoundingClientRect();
  for(const el of currentNodes){
    const r=el.getBoundingClientRect();
    const cx=r.left-gr.left+r.width/2,cy=r.top-gr.top+r.height/2;
    if(Math.hypot(pos.x-cx,pos.y-cy)<r.width*.58)return el;
  }
}

function containsSeq(route, seq){
  outer: for(let i=0;i<=route.length-seq.length;i++){
    for(let j=0;j<seq.length;j++) if(route[i+j]!==seq[j]) continue outer;
    return true;
  }
  return false;
}
function isPrefixAnywhere(route, seq){
  if(!route.length)return false;
  const max=Math.min(route.length,seq.length);
  for(let len=1;len<=max;len++){
    const tail=route.slice(-len);
    if(tail.every((v,i)=>v===seq[i])) return true;
  }
  return false;
}
function matchedRecipes(route){
  return recipes.filter(r=>containsSeq(route,r.seq));
}
function updateComboUI(){
  const route=drawn.map(n=>n.dataset.type);
  document.querySelectorAll(".recipe").forEach(el=>{
    el.classList.remove("possible","matched");
    const r=recipes.find(x=>x.name===el.dataset.recipe);
    if(!r)return;
    if(containsSeq(route,r.seq)) el.classList.add("matched");
    else if(isPrefixAnywhere(route,r.seq)) el.classList.add("possible");
  });
}

function addNode(el){
  if(drawn.includes(el))return;
  drawn.push(el);el.classList.add("sel");
  document.getElementById("selectedCount").textContent=`${drawn.length} CHAIN`;
  updateComboUI();
  drawLines();
}



const touchSurface=document.getElementById("touchSurface");

function posFromClient(clientX,clientY){
  const r=game.getBoundingClientRect();
  return {x:clientX-r.left,y:clientY-r.top};
}
function beginSelection(clientX,clientY){
  if(!active)return;
  dragging=true;
  keepLiveVideoPlaying();
  const pos=posFromClient(clientX,clientY);
  const n=hitNode(pos);
  if(n)addNode(n);
  drawLines(pos);
}
function moveSelection(clientX,clientY){
  if(!active||!dragging)return;
  const pos=posFromClient(clientX,clientY);
  const n=hitNode(pos);
  if(n)addNode(n);
  drawLines(pos);
}
function endSelection(){
  if(!active||!dragging)return;
  dragging=false;
  drawLines();
  if(drawn.length>0)finishTurn();
}

/* iPhone / iPad: use native touch events on a dedicated transparent layer. */
touchSurface.addEventListener("touchstart",e=>{
  if(!active||!e.touches.length)return;
  e.preventDefault();
  const t=e.touches[0];
  beginSelection(t.clientX,t.clientY);
},{passive:false});

touchSurface.addEventListener("touchmove",e=>{
  if(!active||!dragging||!e.touches.length)return;
  e.preventDefault();
  const t=e.touches[0];
  moveSelection(t.clientX,t.clientY);
},{passive:false});

touchSurface.addEventListener("touchend",e=>{
  if(!dragging)return;
  e.preventDefault();
  endSelection();
},{passive:false});

touchSurface.addEventListener("touchcancel",e=>{
  if(!dragging)return;
  e.preventDefault();
  endSelection();
},{passive:false});

/* PC: mouse fallback for the same input surface. */
touchSurface.addEventListener("mousedown",e=>{
  if(!active)return;
  e.preventDefault();
  beginSelection(e.clientX,e.clientY);
});
window.addEventListener("mousemove",e=>{
  if(!dragging)return;
  e.preventDefault();
  moveSelection(e.clientX,e.clientY);
});
window.addEventListener("mouseup",e=>{
  if(!dragging)return;
  e.preventDefault();
  endSelection();
});

function startTurn(){
  if(active||turn>=6)return;
  active=true;time=7;drawn=[];
  setTheme();spawn();
  document.getElementById("countdown").textContent="7";

  timer=setInterval(()=>{
    time-=0.1;
    document.getElementById("countdown").textContent=String(Math.max(1,Math.ceil(time)));
    if(time<=0){
      document.getElementById("countdown").textContent="0";
      finishTurn();
    }
  },100);
}

function finishTurn(){
  if(!active)return;
  active=false;
  if(timer){clearInterval(timer);timer=null}

  const types=drawn.map(n=>n.dataset.type);
  const t=themes[turn];
  const matches=matchedRecipes(types);

  let base=types.length*7000;
  let mult=1;
  if(t.type==="any") mult*=1+(Math.max(0,types.length-2)*.12);
  else if(types.includes(t.type)) mult*=t.mult;

  // Each equipped combo can trigger once per traced route.
  matches.forEach(r=>{ mult*=r.mult; });
  const gained=Math.round(base*mult);
  score+=gained;
  audience=Math.min(100,audience+Math.round(types.length*1.5+matches.length*7));

  document.getElementById("score").textContent=score.toLocaleString();
  document.getElementById("audience").textContent=audience+"%";

  const completedTurn=turn+1;
  turn++;
  nodeLayer.innerHTML="";

  const fireFlash=()=>{
    waveFlash.classList.remove("fire");
    void waveFlash.offsetWidth;
    waveFlash.classList.add("fire");
  };

  const goNext=()=>{
    document.querySelectorAll(".recipe").forEach(x=>x.classList.remove("possible","matched"));
    if(turn>=6){
      document.getElementById("turnLabel").textContent="LIVE CLEAR";
      document.getElementById("countdown").textContent="END";
      document.getElementById("themeName").textContent="FINAL RESULT";
      document.getElementById("themeDesc").textContent="6ターン終了";
      document.getElementById("finalScoreValue").textContent=score.toLocaleString();
      document.getElementById("finalScoreOverlay").style.display="flex";
    }else{
      setTimeout(startTurn,110);
    }
  };

  // Performance insert is a reward only when one or more combo skills succeed.
  if(matches.length){
    const top=[...matches].sort((a,b)=>b.seq.length-a.seq.length)[0];
    document.getElementById("cutinMoveName").textContent =
      matches.length>1 ? `${top.name}  /  ${matches.length} COMBO` : top.name;
    document.getElementById("cutinGainScore").textContent=`+${gained.toLocaleString()}`;
    document.getElementById("cutinRoute").textContent=types.map(x=>x==="voice"?"声響":x==="rhythm"?"律動":"華耀").join(" → ");

    cutinVideo.src=`cutin_${completedTurn}.mp4`;
    cutinVideo.currentTime=0;
    cutinVideo.load();

    let advanced=false;
    const advance=()=>{
      if(advanced)return; advanced=true;
      fireFlash();
      setTimeout(()=>{cutinOverlay.style.display="none";cutinVideo.pause();goNext();},100);
    };
    const show=()=>{
      fireFlash();
      setTimeout(()=>{
        cutinOverlay.style.display="flex";
        cutinVideo.addEventListener("ended",advance,{once:true});
        const p=cutinVideo.play();
        if(p&&typeof p.catch==="function")p.catch(()=>setTimeout(advance,1500));
      },100);
    };
    if(cutinVideo.readyState>=2)show();
    else cutinVideo.addEventListener("loadeddata",show,{once:true});
  }else{
    const no=q=>document.getElementById(q);
    no("noComboOverlay").style.display="flex";
    setTimeout(()=>{no("noComboOverlay").style.display="none";goNext();},520);
  }
}

function animateNodes(now){
  const dt=Math.min(40,now-lastMoveTime);lastMoveTime=now;
  if(active){
    for(const el of currentNodes){
      if(el.dataset.moving!=="1"||drawn.includes(el))continue;
      el._px+=el._vx*dt;el._py+=el._vy*dt;
      if(el._px<10){el._px=10;el._vx=Math.abs(el._vx)}
      if(el._px>90){el._px=90;el._vx=-Math.abs(el._vx)}
      if(el._py<12){el._py=12;el._vy=Math.abs(el._vy)}
      if(el._py>76){el._py=76;el._vy=-Math.abs(el._vy)}
      el.style.left=el._px+"%";el.style.top=el._py+"%";
    }
    drawLines();
  }
  requestAnimationFrame(animateNodes);
}
requestAnimationFrame(animateNodes);

function preGameCountdown(){
  keepLiveVideoPlaying();
  const overlay=document.getElementById("preCountdown");
  overlay.style.display="flex";
  overlay.style.background="rgba(3,6,14,.48)";
  const seq=["3","2","1","LIVE START!"];
  let i=0;overlay.textContent=seq[i];
  const iv=setInterval(()=>{
    i++;
    if(i>=seq.length){
      clearInterval(iv);
      overlay.style.display="none";
      startTurn();
      return;
    }
    overlay.textContent=seq[i];
  },650);
}
function resetGame(){
  if(timer){clearInterval(timer);timer=null}
  active=false;dragging=false;turn=0;score=0;audience=20;drawn=[];
  document.getElementById("finalScoreOverlay").style.display="none";
  nodeLayer.innerHTML="";
  cutinOverlay.style.display="none";
  finalScoreOverlay.style.display="none";
  cutinVideo.pause();
  cutinVideo.removeAttribute("src");
  waveFlash.classList.remove("fire");
  document.getElementById("score").textContent="0";
  document.getElementById("audience").textContent="20%";
  document.getElementById("countdown").textContent="7";
  setTheme();
  setTimeout(preGameCountdown,250);
}
resetBtn.addEventListener("click",resetGame);
document.getElementById("retryLive").addEventListener("click",()=>{document.getElementById("finalScoreOverlay").style.display="none";resetGame();});
resetGame();

</script>
