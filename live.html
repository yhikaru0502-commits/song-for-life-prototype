<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HARMONIA LIVE v23</title>
<style>
:root {
  --glass:rgba(8,12,24,.48);
  --line:rgba(255,255,255,.16);
  --text:#fff;
  --muted:rgba(255,255,255,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:#050812;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;touch-action:none;overscroll-behavior:none;
}
button{font:inherit}
#app{width:100%;height:100%;background:#050812}
#game{
  position:relative;width:100%;height:100%;
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  background:#050812;
}
#liveBg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center center;
  z-index:0;pointer-events:none;
}
#videoShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(2,5,12,.34) 0%,rgba(2,5,12,.05) 22%,rgba(2,5,12,.02) 62%,rgba(2,5,12,.46) 100%),
    radial-gradient(circle at 50% 45%,transparent 0 50%,rgba(2,5,12,.15) 100%);
}
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
#topHud{
  position:absolute;
  top:max(10px,env(safe-area-inset-top));
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  z-index:30;
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:7px;
  align-items:start;
  pointer-events:none;
}
#stageInfo{border-radius:14px;padding:8px 10px;min-width:0}
.hudRow{display:flex;justify-content:space-between;gap:8px;align-items:center}
#turnLabel{font-size:14px;font-weight:800}
#difficulty{font-size:9px;color:var(--muted)}
#themeName{font-size:12px;font-weight:700;margin-top:2px}
#themeDesc{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scoreHud,#timerBox{
  border-radius:14px;padding:7px 9px;text-align:center;min-width:68px;
}
.hudLabel{font-size:8px;color:var(--muted);letter-spacing:.08em}
#score{font-size:16px;font-weight:800;margin-top:1px}
#countdown{font-size:29px;font-weight:900;line-height:1;margin-top:2px}
#audienceHud{
  position:absolute;
  left:max(10px,env(safe-area-inset-left));
  top:108px;z-index:30;
  border-radius:999px;padding:6px 9px;
  display:flex;gap:8px;align-items:center;
  font-size:9px;pointer-events:none;
}
#audienceHud b{font-size:12px}
#lineLayer{position:absolute;inset:0;z-index:8;pointer-events:none}
#nodeLayer{position:absolute;inset:0;z-index:12;pointer-events:none}
.node{
  position:absolute;width:78px;height:78px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid rgba(255,255,255,.76);
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.24),rgba(9,14,27,.56));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:800;
  box-shadow:0 0 18px currentColor,inset 0 0 20px rgba(255,255,255,.10);
  pointer-events:none;
}
.node .icon{font-size:26px;line-height:1;margin-bottom:2px}
.node small{font-size:8px;opacity:.82}
.node.vocal{color:#69ddff}
.node.expression{color:#ff72c0}
.node.dance{color:#ffd76e}
.node.control{color:#8cf6ae}
.node.resonance{color:#c4a2ff}
.node.sel{
  transform:translate(-50%,-50%) scale(1.12);
  box-shadow:0 0 30px currentColor,0 0 55px currentColor;
}
#touchSurface{
  position:absolute;inset:0;z-index:25;
  background:transparent;pointer-events:auto;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
#comboDock{
  position:absolute;
  left:max(10px,env(safe-area-inset-left));
  right:max(10px,env(safe-area-inset-right));
  bottom:calc(max(10px,env(safe-area-inset-bottom)) + 10px);
  z-index:31;border-radius:16px;padding:8px 8px 9px;
  pointer-events:none;
}
.comboTitle{
  display:flex;justify-content:space-between;align-items:center;
  font-size:9px;color:var(--muted);letter-spacing:.05em;
}
#selectedCount{color:#fff;font-weight:700}
.recipeRow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.recipe{
  background:rgba(13,18,34,.45);
  border:1px solid rgba(255,255,255,.10);
  border-radius:11px;padding:5px 4px;text-align:center;
}
.recipeName{font-size:7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipeSeq{font-size:15px;margin-top:2px;white-space:nowrap}
#resetBtn{
  position:absolute;
  right:max(12px,env(safe-area-inset-right));
  top:132px;z-index:35;
  border:1px solid var(--line);
  background:rgba(8,12,24,.48);
  color:#fff;border-radius:999px;
  padding:6px 10px;font-size:9px;font-weight:700;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:auto;
}
#dragHint{
  position:absolute;left:50%;bottom:125px;
  transform:translateX(-50%);
  z-index:18;background:rgba(4,8,18,.48);
  border:1px solid var(--line);border-radius:999px;
  padding:5px 9px;font-size:9px;color:rgba(255,255,255,.82);
  white-space:nowrap;pointer-events:none;
}
.centerOverlay{
  position:absolute;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(3,6,14,.26);
  backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
  pointer-events:none;
}
#preCountdown{
  font-size:104px;font-weight:900;
  text-shadow:0 0 30px rgba(255,255,255,.35);
}
#performanceInner{width:100%;padding:0 20px}
#performance .move{
  font-size:30px;font-weight:900;line-height:1.05;
  text-shadow:0 0 18px rgba(255,92,168,.65);
}
#gainScore{
  font-size:58px;font-weight:900;line-height:1;
  margin-top:10px;
  text-shadow:0 0 20px rgba(255,92,168,.85),0 0 38px rgba(104,223,255,.45);
}
#performance .route{font-size:11px;color:rgba(255,255,255,.82);margin-top:8px}
@media (min-width:700px){
  #game{max-width:430px;margin:0 auto}
}

#cutinOverlay{
  position:absolute;inset:0;z-index:60;
  display:none;overflow:hidden;pointer-events:none;
  background:transparent;
  align-items:center;justify-content:center;
}
#cutinBand{
  position:absolute;left:-7%;right:-7%;top:50%;
  height:36%;transform:translateY(-50%) skewY(-7deg);
  overflow:hidden;
  background:linear-gradient(100deg,rgba(8,2,12,.94),rgba(55,4,31,.84) 58%,rgba(9,2,17,.92));
  border-top:2px solid rgba(255,55,145,.9);
  border-bottom:2px solid rgba(190,80,255,.88);
  box-shadow:0 0 24px rgba(255,30,125,.38),0 0 42px rgba(125,65,255,.25);
}
#cutinBand::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 0 35%,rgba(255,255,255,.10) 48%,transparent 60%);
  mix-blend-mode:screen;
}
#cutinImage{
  position:absolute;z-index:2;left:-3%;top:50%;
  width:106%;height:54%;object-fit:contain;object-position:center;
  transform:translate(105%,-50%) scale(1.04);
  opacity:0;filter:drop-shadow(0 0 10px rgba(255,40,130,.38));
}
#cutinOverlay.level1 #cutinBand{height:34%}
#cutinOverlay.level1 #cutinImage{height:48%}
#cutinOverlay.level2 #cutinBand{height:46%}
#cutinOverlay.level2 #cutinImage{height:62%}
#cutinOverlay.level3 #cutinBand{height:60%}
#cutinOverlay.level3 #cutinImage{height:76%}
#cutinOverlay.enter #cutinBand{animation:cutinBandIn .18s cubic-bezier(.2,.8,.2,1) both}
#cutinOverlay.enter #cutinImage{animation:cutinImageIn .22s cubic-bezier(.12,.82,.22,1) both}
#cutinOverlay.exit #cutinBand{animation:cutinBandOut .16s ease-in both}
#cutinOverlay.exit #cutinImage{animation:cutinImageOut .16s ease-in both}
@keyframes cutinBandIn{from{opacity:0;transform:translate(110%,-50%) skewY(-7deg)}to{opacity:1;transform:translate(0,-50%) skewY(-7deg)}}
@keyframes cutinImageIn{from{opacity:0;transform:translate(105%,-50%) scale(1.04)}to{opacity:1;transform:translate(0,-50%) scale(1)}}
@keyframes cutinBandOut{to{opacity:0;transform:translate(-110%,-50%) skewY(-7deg)}}
@keyframes cutinImageOut{to{opacity:0;transform:translate(-80%,-50%) scale(1.02)}}
#cutinOverlay.level4{background:#000}
#cutinOverlay.level4 #cutinBand{display:none}
#cutinOverlay.level4 #cutinImage{
  left:0;top:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  transform:scale(1.035);opacity:0;filter:none;
}
#cutinOverlay.level4.enter #cutinImage{animation:finalCutinIn .28s ease-out both}
#cutinOverlay.level4.exit #cutinImage{animation:finalCutinOut .18s ease-in both}
@keyframes finalCutinIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1.02)}}
@keyframes finalCutinOut{to{opacity:0;transform:scale(1.055)}}
#cutinScoreBox{
  position:absolute;left:0;right:0;bottom:8%;z-index:4;
  text-align:center;padding:16px 18px 18px;
  background:linear-gradient(180deg,transparent,rgba(4,6,14,.72));
  text-shadow:0 0 18px rgba(0,0,0,.8);
}
#cutinMoveName{font-size:20px;font-weight:900;letter-spacing:.06em}
#cutinGainScore{font-size:58px;line-height:1;font-weight:900;margin-top:8px}
#cutinRoute{margin-top:8px;font-size:11px;color:rgba(255,255,255,.86)}
#cutinOverlay.level1 #cutinScoreBox,
#cutinOverlay.level2 #cutinScoreBox,
#cutinOverlay.level3 #cutinScoreBox{bottom:18%;background:none}
#finalScoreOverlay{
  z-index:80;
  background:rgba(3,5,12,.74);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#finalScoreInner{
  width:100%;
  text-align:center;
  padding:24px;
}
#finalScoreLabel{
  font-size:18px;
  font-weight:800;
  letter-spacing:.18em;
  opacity:.82;
}
#finalScoreValue{
  margin-top:14px;
  font-size:72px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.03em;
  text-shadow:0 0 26px rgba(255,255,255,.25);
}
#finalScoreSub{
  margin-top:16px;
  font-size:20px;
  font-weight:900;
}


.node.medium{width:70px;height:70px;font-size:11px}
.node.medium .icon{font-size:23px}
.node.compact{width:64px;height:64px;font-size:10px}
.node.compact .icon{font-size:21px}
.node.compact small{font-size:7px}
#waveFlash{
  position:absolute;inset:0;z-index:70;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,1) 0%,rgba(210,235,255,.96) 18%,rgba(205,165,255,.65) 45%,rgba(255,255,255,0) 76%);
  mix-blend-mode:screen;
}
#waveFlash.fire{animation:waveFlash .28s ease-out both}
@keyframes waveFlash{
  0%{opacity:0}
  32%{opacity:1}
  100%{opacity:0}
}


/* --- Three Existence Wave attributes --- */
.node{

}

}
.node.voice::before{background-image:url("assets/wave/voice_normal.png")}
.node.rhythm::before{background-image:url("assets/wave/rhythm_normal.png")}
.node.glory::before{background-image:url("assets/wave/glory_normal.png")}
.node.voice.sel::before{background-image:url("assets/wave/voice_active.png")}

#noComboOverlay{

#retryLive{

#uiVariantTag{

  border:1px solid rgba(255,255,255,.14);font-size:8px;font-weight:900;letter-spacing:.08em;

}

/* v23: combo-card hand + tutorial */

  position:absolute;inset:0;z-index:76;display:none;

  background:rgba(4,8,18,.84);border:1px solid rgba(126,226,255,.28);

#storyOverlay{

}
#storyBox{
  width:min(92%,390px);padding:20px 18px;border-radius:18px;
  background:rgba(7,10,19,.92);border:1px solid rgba(255,255,255,.16);text-align:left;
}
#storySpeaker{font-size:11px;color:#8ee8ff;font-weight:900;letter-spacing:.08em}
#storyText{margin-top:8px;font-size:22px;font-weight:900;line-height:1.55}
#storyTap{margin-top:14px;text-align:right;font-size:9px;opacity:.55}
#tutorialComplete{
  position:absolute;inset:0;z-index:92;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,10,.76);text-align:center;font-weight:1000;letter-spacing:.08em;
  font-size:28px;pointer-events:none;
}

</style>
</head>
<body>
<div id="app">
  <div id="game">
    <video id="liveBg" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="play_bg.mp4" type="video/mp4">
    </video>
    <div id="videoShade"></div>

    <div id="topHud">
      <div id="stageInfo" class="glass">
        <div class="hudRow">
          <span id="turnLabel">TURN 1 / 6</span>
          <span id="difficulty">STATIC</span>
        </div>
        <div id="themeName">静寂の導入</div>
        <div id="themeDesc">VOCAL系を含むルートが高得点</div>
      </div>
      <div id="scoreHud" class="glass">
        <div class="hudLabel">SCORE</div>
        <div id="score">0</div>
      </div>
      <div id="timerBox" class="glass">
        <div class="hudLabel">TIME</div>
        <div id="countdown">30</div>
      </div>
    </div>

    
    <div id="audienceHud" class="glass">
      <span>AUDIENCE</span><b id="audience">20%</b>
    </div>

    <canvas id="lineLayer"></canvas>
    <div id="nodeLayer"></div>
    <div id="touchSurface" aria-label="スキル選択エリア"></div>

    <div id="comboDock" class="glass">
      <div class="comboTitle">
        <span>RIN / COMBO SET</span>
        <span id="selectedCount">0 CHAIN</span>
      </div>
      <div class="recipeRow">
        <div class="recipe" data-recipe="SHOUT">
          <div class="recipeName">SHOUT</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""></div>
        </div>
        <div class="recipe" data-recipe="SCREAM">
          <div class="recipeName">SCREAM</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""></div>
        </div>
        <div class="recipe" data-recipe="BREAK BEAT">
          <div class="recipeName">BREAK BEAT</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave rhythm" src="assets/wave/rhythm_normal.png" alt=""></div>
        </div>
        <div class="recipe" data-recipe="HOWLING">
          <div class="recipeName">HOWLING</div>
          <div class="recipeSeq"><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""><span>›</span><img class="comboWave glory" src="assets/wave/glory_normal.png" alt=""><span>›</span><img class="comboWave voice" src="assets/wave/voice_normal.png" alt=""></div>
        </div>
      </div>
    </div>


    <div id="handOverlay">
      <div id="handPanel">
        <div id="handTitle">COMBO SKILL / SELECT 4</div>
        <div id="handGuide">今回使うコンボスキルを4つ選択</div>
        <div id="handGrid"></div>
        <div id="handFooter">
          <div id="handCount">0 / 4 SET</div>
          <button id="handSetBtn" type="button" disabled>SET</button>
        </div>
      </div>
    </div>

    <div id="tutorialHint"></div>

    <div id="storyOverlay">
      <div id="storyBox">
        <div id="storySpeaker"></div>
        <div id="storyText"></div>
        <div id="storyTap">TAP ▶</div>
      </div>
    </div>
    <div id="tutorialComplete">TUTORIAL COMPLETE</div>

    <div id="noComboOverlay"><div>NO COMBO</div></div>

    <button id="resetBtn" type="button">RESET</button>
    <div id="dragHint">スキルを見つけて一筆書き　指を離すと即決定</div>

    <div id="preCountdown" class="centerOverlay">3</div>
    <div id="waveFlash"></div>

    <div id="cutinOverlay">
      <div id="cutinBand"></div>
      <img id="cutinImage" alt="" draggable="false">
      <div id="cutinScoreBox">
        <div id="cutinMoveName">PERFORMANCE</div>
        <div id="cutinGainScore">+0</div>
        <div id="cutinRoute"></div>
      </div>
    </div>

    <div id="finalScoreOverlay" class="centerOverlay">
      <div id="finalScoreInner">
        <div id="finalScoreLabel">FINAL SCORE</div>
        <div id="finalScoreValue">0</div>
        <div id="finalScoreSub">LIVE CLEAR</div><button id="retryLive" type="button">RETRY LIVE</button>
      </div>
    </div>
  </div>
</div>
<script>

const liveBg=document.getElementById("liveBg");
function keepLiveVideoPlaying(){
  if(!liveBg)return;
  const p=liveBg.play();
  if(p&&typeof p.catch==="function")p.catch(()=>{});
}

const waveIcon={
  voice:"assets/wave/voice_normal.png",
  rhythm:"assets/wave/rhythm_normal.png",
  glory:"assets/wave/glory_normal.png"
};
const waveJP={voice:"声響",rhythm:"律動",glory:"華耀"};

const skills=[
  {name:"声響",type:"voice"},{name:"声響",type:"voice"},{name:"声響",type:"voice"},
  {name:"律動",type:"rhythm"},{name:"律動",type:"rhythm"},{name:"華耀",type:"glory"}
];

/* Prototype combo pool. Names/rates can be tuned later. */
const comboPool=[
  {seq:["voice","voice"],name:"SHOUT",mult:1.35},
  {seq:["voice","voice","voice"],name:"SCREAM",mult:1.75},
  {seq:["voice","voice","rhythm"],name:"BREAK BEAT",mult:1.65},
  {seq:["voice","glory","voice"],name:"HOWLING",mult:1.80},
  {seq:["rhythm","rhythm"],name:"PULSE",mult:1.30},
  {seq:["glory","voice"],name:"SPARK",mult:1.38},
  {seq:["rhythm","voice","rhythm"],name:"RUSH",mult:1.62},
  {seq:["voice","voice","glory","voice"],name:"REBELLION",mult:2.05}
];

const TOTAL_TURNS=5;
const TURN_TIME=30;
const themes=[
  {name:"声響増幅",desc:"《声響》を中心にコンボを組め",type:"voice",mult:1.55},
  {name:"律動干渉",desc:"《律動》を経由する複合コンボが有効",type:"rhythm",mult:1.45},
  {name:"華耀共鳴",desc:"《華耀》を含むルートで存在波が輝く",type:"glory",mult:1.45},
  {name:"複合共鳴",desc:"複数コンボを一本のルートに仕込め",type:"any",mult:1.55},
  {name:"臨界声響",desc:"最長ルートで最大出力を狙え",type:"voice",mult:1.85}
];

const game=document.getElementById("game");
const nodeLayer=document.getElementById("nodeLayer");
const canvas=document.getElementById("lineLayer");
const ctx=canvas.getContext("2d");
const resetBtn=document.getElementById("resetBtn");
const cutinOverlay=document.getElementById("cutinOverlay");
const cutinImage=document.getElementById("cutinImage");
const finalScoreOverlay=document.getElementById("finalScoreOverlay");
const waveFlash=document.getElementById("waveFlash");
const touchSurface=document.getElementById("touchSurface");
const handOverlay=document.getElementById("handOverlay");
const handGrid=document.getElementById("handGrid");
const handGuide=document.getElementById("handGuide");
const handSetBtn=document.getElementById("handSetBtn");
const handCount=document.getElementById("handCount");
const tutorialHint=document.getElementById("tutorialHint");
const storyOverlay=document.getElementById("storyOverlay");
const storySpeaker=document.getElementById("storySpeaker");
const storyText=document.getElementById("storyText");

let turn=0,score=0,audience=20,active=false,time=TURN_TIME,timer=null;
let currentNodes=[],drawn=[],dragging=false,lastMoveTime=performance.now(),lastTraceMove=0;
let selectedRecipes=[],handCards=[],handSelection=[];
let tutorialMode=new URLSearchParams(location.search).get("tutorial")==="1";
let tutorialPhase=tutorialMode?"hand":"off";
let storyStep=0;

function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function seqHTML(seq,cls="comboWave"){
  return seq.map((t,i)=>`${i?'<span>›</span>':''}<img class="${cls} ${t}" src="${waveIcon[t]}" alt="${waveJP[t]}">`).join("");
}
function resizeCanvas(){
  const r=game.getBoundingClientRect();
  canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);drawLines();
}
addEventListener("resize",resizeCanvas);

function setTheme(){
  const t=themes[turn]||themes[themes.length-1];
  document.getElementById("turnLabel").textContent=`TURN ${turn+1} / ${TOTAL_TURNS}`;
  document.getElementById("themeName").textContent=t.name;
  document.getElementById("themeDesc").textContent=t.desc;
  document.getElementById("difficulty").textContent=turn<TOTAL_TURNS-1?"STATIC":"MOVING";
}

function renderComboDock(){
  const row=document.querySelector("#comboDock .recipeRow");
  row.innerHTML="";
  selectedRecipes.forEach(r=>{
    const el=document.createElement("div");
    el.className="recipe";el.dataset.recipe=r.name;
    el.innerHTML=`<div class="recipeName">${r.name}</div><div class="recipeSeq">${seqHTML(r.seq)}</div>`;
    row.appendChild(el);
  });
}

function makeHand(isTutorial=false){
  handSelection=[];
  if(isTutorial){
    const must=["SHOUT","SCREAM","BREAK BEAT","HOWLING","PULSE","SPARK"];
    handCards=must.map(n=>comboPool.find(r=>r.name===n));
  }else{
    handCards=shuffled(comboPool).slice(0,6);
  }
  renderHand(isTutorial);
}
function renderHand(isTutorial=false){
  handGrid.innerHTML="";
  handCards.forEach((r,idx)=>{
    const b=document.createElement("button");
    b.className="handCard";
    if(isTutorial&&tutorialPhase==="hand"&&handSelection.length===0&&r.name==="SHOUT")b.classList.add("forced");
    if(isTutorial&&tutorialPhase==="hand"&&handSelection.length===0&&r.name!=="SHOUT")b.classList.add("locked");
    if(handSelection.includes(r))b.classList.add("selected");
    b.innerHTML=`<div class="pickNo">${handSelection.indexOf(r)+1}</div><div class="cardName">${r.name}</div><div class="cardSeq">${seqHTML(r.seq,"")}</div>`;
    b.addEventListener("click",()=>{
      if(isTutorial&&tutorialPhase==="hand"&&handSelection.length===0&&r.name!=="SHOUT")return;
      toggleHand(r,isTutorial);
    });
    handGrid.appendChild(b);
  });
  handCount.textContent=`${handSelection.length} / 4 SET`;
  handSetBtn.disabled=handSelection.length!==4;
}
function toggleHand(r,isTutorial){
  const i=handSelection.indexOf(r);
  if(i>=0)handSelection.splice(i,1);
  else if(handSelection.length<4)handSelection.push(r);
  if(isTutorial&&handSelection.length===1&&handSelection[0].name==="SHOUT"){
    handGuide.textContent="SHOUTをセット。残り3枚は自由に選んでください";
  }
  renderHand(isTutorial);
}
handSetBtn.addEventListener("click",()=>{
  if(handSelection.length!==4)return;
  selectedRecipes=[...handSelection];
  renderComboDock();
  handOverlay.style.display="none";
  if(tutorialMode&&tutorialPhase==="hand"){
    tutorialPhase="trace";
    startTutorialTrace();
  }else{
    beginTurnAfterHand();
  }
});

function openHand(isTutorial=false){
  active=false;dragging=false;drawn=[];nodeLayer.innerHTML="";ctx.clearRect(0,0,canvas.width,canvas.height);
  handOverlay.style.display="block";
  handGuide.textContent=isTutorial
    ?"まず《SHOUT》を選び、4つのコンボスキルをセットしてください"
    :"今回使うコンボスキルを4つ選択";
  makeHand(isTutorial);
}

function randomPoints(count){
  const pts=[];let tries=0;
  while(pts.length<count&&tries<400){
    tries++;
    const p={x:11+Math.random()*78,y:14+Math.random()*58};
    const minDist=count>=9?12:(count>=8?13.5:15);
    if(pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>minDist))pts.push(p);
  }
  while(pts.length<count)pts.push({x:13+Math.random()*74,y:15+Math.random()*56});
  return pts;
}
function spawn(fixedTutorial=false){
  nodeLayer.innerHTML="";drawn=[];currentNodes=[];
  document.querySelectorAll(".recipe").forEach(x=>x.classList.remove("possible","matched"));
  let picks,pts;
  if(fixedTutorial){
    picks=[
      {name:"声響",type:"voice"},{name:"声響",type:"voice"},{name:"律動",type:"rhythm"},
      {name:"華耀",type:"glory"},{name:"声響",type:"voice"}
    ];
    pts=[{x:24,y:37},{x:53,y:30},{x:74,y:48},{x:34,y:62},{x:67,y:67}];
  }else{
    const nodeCounts=[7,8,8,9,10];
    const nodeCount=nodeCounts[turn]||9;
    const pool=[];while(pool.length<nodeCount)pool.push(...shuffled(skills));
    picks=pool.slice(0,nodeCount);pts=randomPoints(nodeCount);
  }
  picks.forEach((s,i)=>{
    const el=document.createElement("div");el.className=`node ${s.type}`;
    if(picks.length>=9)el.classList.add("compact");else if(picks.length>=8)el.classList.add("medium");
    el.style.left=pts[i].x+"%";el.style.top=pts[i].y+"%";el.dataset.name=s.name;el.dataset.type=s.type;
    const moving=!fixedTutorial&&turn===TOTAL_TURNS-1;
    el.dataset.moving=moving?"1":"0";
    const speed=moving?0.004:0,a=Math.random()*Math.PI*2;
    el._vx=Math.cos(a)*speed;el._vy=Math.sin(a)*speed;el._px=pts[i].x;el._py=pts[i].y;
    nodeLayer.appendChild(el);currentNodes.push(el);
  });
  resizeCanvas();
}
function nodeCenter(el){
  const gr=game.getBoundingClientRect(),r=el.getBoundingClientRect();
  return{x:r.left-gr.left+r.width/2,y:r.top-gr.top+r.height/2};
}
function drawLines(temp){
  const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);if(!drawn.length)return;
  const pts=drawn.map(nodeCenter);if(temp)pts.push(temp);if(pts.length<2)return;
  const grad=ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,"rgba(110,225,255,.98)");grad.addColorStop(.45,"rgba(220,160,255,.98)");grad.addColorStop(1,"rgba(255,235,150,.98)");
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle="rgba(190,150,255,.25)";ctx.lineWidth=14;ctx.shadowColor="rgba(180,125,255,.9)";ctx.shadowBlur=12;ctx.stroke();
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle=grad;ctx.lineWidth=4.5;ctx.shadowColor="rgba(125,225,255,.95)";ctx.shadowBlur=6;ctx.stroke();
  ctx.restore();
}
function posFromClient(x,y){const r=game.getBoundingClientRect();return{x:x-r.left,y:y-r.top}}
function hitNode(pos){
  const gr=game.getBoundingClientRect();
  return currentNodes.find(el=>{const r=el.getBoundingClientRect(),cx=r.left-gr.left+r.width/2,cy=r.top-gr.top+r.height/2;return Math.hypot(pos.x-cx,pos.y-cy)<r.width*.58});
}
function containsSeq(route,seq){
  outer:for(let i=0;i<=route.length-seq.length;i++){
    for(let j=0;j<seq.length;j++)if(route[i+j]!==seq[j])continue outer;
    return true;
  }return false;
}
function isPrefixAnywhere(route,seq){
  if(!route.length)return false;
  const max=Math.min(route.length,seq.length);
  for(let len=1;len<=max;len++){
    const tail=route.slice(-len);
    if(tail.every((v,i)=>v===seq[i]))return true;
  }return false;
}
function matchedRecipes(route){return selectedRecipes.filter(r=>containsSeq(route,r.seq))}
function updateComboUI(){
  const route=drawn.map(n=>n.dataset.type);
  document.querySelectorAll(".recipe").forEach(el=>{
    el.classList.remove("possible","matched");
    const r=selectedRecipes.find(x=>x.name===el.dataset.recipe);if(!r)return;
    if(containsSeq(route,r.seq))el.classList.add("matched");
    else if(isPrefixAnywhere(route,r.seq))el.classList.add("possible");
  });
}
function addNode(el){
  if(!el||drawn.includes(el))return;
  drawn.push(el);el.classList.add("sel");updateComboUI();drawLines();
}
function beginSelection(x,y){
  if(!active)return;
  dragging=true;keepLiveVideoPlaying();
  const p=posFromClient(x,y),n=hitNode(p);if(n)addNode(n);drawLines(p);
}
function moveSelection(x,y){
  if(!active||!dragging)return;
  const now=performance.now();if(now-lastTraceMove<32)return;lastTraceMove=now;
  const p=posFromClient(x,y),n=hitNode(p);if(n)addNode(n);drawLines(p);
}
function endSelection(){
  if(!active||!dragging)return;
  dragging=false;drawLines();if(drawn.length)finishTurn();
}
touchSurface.addEventListener("touchstart",e=>{if(!active||!e.touches.length)return;e.preventDefault();const t=e.touches[0];beginSelection(t.clientX,t.clientY)},{passive:false});
touchSurface.addEventListener("touchmove",e=>{if(!active||!dragging||!e.touches.length)return;e.preventDefault();const t=e.touches[0];moveSelection(t.clientX,t.clientY)},{passive:false});
touchSurface.addEventListener("touchend",e=>{if(!dragging)return;e.preventDefault();endSelection()},{passive:false});
touchSurface.addEventListener("mousedown",e=>{if(!active)return;e.preventDefault();beginSelection(e.clientX,e.clientY)});
addEventListener("mousemove",e=>{if(!dragging)return;e.preventDefault();moveSelection(e.clientX,e.clientY)});
addEventListener("mouseup",e=>{if(!dragging)return;e.preventDefault();endSelection()});

function fireFlash(){waveFlash.classList.remove("fire");void waveFlash.offsetWidth;waveFlash.classList.add("fire")}
function showCutin(level,moveName,gained,route,onDone){
  level=Math.max(1,Math.min(4,level));
  cutinOverlay.className=`level${level}`;
  cutinImage.src=`cutin_${level}.png`;
  document.getElementById("cutinMoveName").textContent=moveName;
  document.getElementById("cutinGainScore").textContent=`+${gained.toLocaleString()}`;
  document.getElementById("cutinRoute").textContent=route;
  fireFlash();
  setTimeout(()=>{
    cutinOverlay.style.display="block";cutinOverlay.classList.add("enter");
    const hold=level===4?900:(level===3?700:560);
    setTimeout(()=>{
      cutinOverlay.classList.remove("enter");cutinOverlay.classList.add("exit");
      setTimeout(()=>{
        cutinOverlay.style.display="none";cutinOverlay.className="";
        if(onDone)onDone();
      },190);
    },hold);
  },70);
}

function startTutorialTrace(){
  document.getElementById("turnLabel").textContent="TUTORIAL";
  document.getElementById("themeName").textContent="COMBO TEST";
  document.getElementById("countdown").textContent="∞";
  tutorialHint.textContent="下のCOMBO SETを確認し、《声響》→《声響》と2つなぞって SHOUT を発動";
  tutorialHint.style.display="block";
  spawn(true);active=true;
}
function tutorialFail(){
  active=false;
  tutorialHint.textContent="もう一度。《声響》→《声響》の順になぞしてください";
  setTimeout(()=>{spawn(true);active=true},450);
}
function startTutorialStory(){
  tutorialHint.style.display="none";
  storyStep=0;
  const steps=[
    ["試験官","……凄まじい歌力だ！"],
    ["試験官","もっと！"],
    ["凛","……言われなくても"]
  ];
  function show(){
    const s=steps[storyStep];storySpeaker.textContent=s[0];storyText.textContent=s[1];storyOverlay.style.display="flex";
  }
  storyOverlay.onclick=()=>{
    storyStep++;
    if(storyStep>=steps.length){
      storyOverlay.style.display="none";
      const tc=document.getElementById("tutorialComplete");tc.style.display="flex";
      setTimeout(()=>{tc.style.display="none";tutorialMode=false;tutorialPhase="done";startMainGame()},900);
    }else show();
  };
  show();
}
function beginTurnAfterHand(){
  active=true;time=TURN_TIME;drawn=[];setTheme();spawn(false);
  document.getElementById("countdown").textContent=String(TURN_TIME);
  timer=setInterval(()=>{
    time-=0.1;document.getElementById("countdown").textContent=String(Math.max(1,Math.ceil(time)));
    if(time<=0){document.getElementById("countdown").textContent="0";finishTurn()}
  },100);
}
function finishTurn(){
  if(!active)return;active=false;if(timer){clearInterval(timer);timer=null}
  const types=drawn.map(n=>n.dataset.type),matches=matchedRecipes(types);

  if(tutorialMode&&tutorialPhase==="trace"){
    if(!matches.some(r=>r.name==="SHOUT")){tutorialFail();return}
    const gained=12000;
    score+=gained;document.getElementById("score").textContent=score.toLocaleString();
    nodeLayer.innerHTML="";
    showCutin(1,"SHOUT",gained,"声響 → 声響",startTutorialStory);
    return;
  }

  const t=themes[turn]||themes[0];
  let base=types.length*7000,mult=1;
  if(t.type==="any")mult*=1+(Math.max(0,types.length-2)*.12);
  else if(types.includes(t.type))mult*=t.mult;
  matches.forEach(r=>mult*=r.mult);
  const gained=Math.round(base*mult);
  score+=gained;audience=Math.min(100,audience+Math.round(types.length*1.5+matches.length*7));
  document.getElementById("score").textContent=score.toLocaleString();
  document.getElementById("audience").textContent=audience+"%";
  turn++;nodeLayer.innerHTML="";

  const goNext=()=>{
    document.querySelectorAll(".recipe").forEach(x=>x.classList.remove("possible","matched"));
    if(turn>=TOTAL_TURNS){
      document.getElementById("turnLabel").textContent="LIVE CLEAR";
      document.getElementById("countdown").textContent="END";
      document.getElementById("themeName").textContent="FINAL RESULT";
      document.getElementById("finalScoreValue").textContent=score.toLocaleString();
      finalScoreOverlay.style.display="flex";
    }else setTimeout(()=>openHand(false),300);
  };

  if(matches.length){
    const top=[...matches].sort((a,b)=>b.seq.length-a.seq.length)[0];
    const route=types.map(x=>waveJP[x]).join(" → ");
    showCutin(matches.length,top.name,gained,route,goNext);
  }else{
    document.getElementById("noComboOverlay").style.display="flex";
    setTimeout(()=>{document.getElementById("noComboOverlay").style.display="none";goNext()},520);
  }
}

let lastAnimFrame=0;
function animateNodes(now){
  if(now-lastAnimFrame<32){requestAnimationFrame(animateNodes);return}
  const dt=Math.min(48,now-lastMoveTime);lastMoveTime=now;lastAnimFrame=now;
  if(active){
    currentNodes.forEach(el=>{
      if(el.dataset.moving!=="1"||drawn.includes(el))return;
      el._px+=el._vx*dt;el._py+=el._vy*dt;
      if(el._px<10){el._px=10;el._vx=Math.abs(el._vx)}if(el._px>90){el._px=90;el._vx=-Math.abs(el._vx)}
      if(el._py<13){el._py=13;el._vy=Math.abs(el._vy)}if(el._py>74){el._py=74;el._vy=-Math.abs(el._vy)}
      el.style.left=el._px+"%";el.style.top=el._py+"%";
    });
    if(dragging)drawLines();
  }
  requestAnimationFrame(animateNodes);
}
requestAnimationFrame(animateNodes);

function preGameCountdown(cb){
  keepLiveVideoPlaying();
  const overlay=document.getElementById("preCountdown");overlay.style.display="flex";overlay.style.background="rgba(3,6,14,.48)";
  const seq=["3","2","1","LIVE START!"];let i=0;overlay.textContent=seq[0];
  const iv=setInterval(()=>{
    i++;
    if(i>=seq.length){clearInterval(iv);overlay.style.display="none";cb();return}
    overlay.textContent=seq[i];
  },560);
}
function startMainGame(){
  turn=0;score=0;audience=20;
  document.getElementById("score").textContent="0";document.getElementById("audience").textContent="20%";
  preGameCountdown(()=>openHand(false));
}
function resetGame(){
  if(timer){clearInterval(timer);timer=null}
  active=false;dragging=false;turn=0;score=0;audience=20;drawn=[];selectedRecipes=[];
  nodeLayer.innerHTML="";ctx.clearRect(0,0,canvas.width,canvas.height);
  handOverlay.style.display="none";storyOverlay.style.display="none";tutorialHint.style.display="none";
  cutinOverlay.style.display="none";finalScoreOverlay.style.display="none";waveFlash.classList.remove("fire");
  document.getElementById("score").textContent="0";document.getElementById("audience").textContent="20%";
  document.getElementById("countdown").textContent=String(TURN_TIME);
  if(tutorialMode){tutorialPhase="hand";setTimeout(()=>openHand(true),250)}
  else setTimeout(()=>preGameCountdown(()=>openHand(false)),250);
}
resetBtn.addEventListener("click",resetGame);
document.getElementById("retryLive").addEventListener("click",()=>{finalScoreOverlay.style.display="none";tutorialMode=false;resetGame()});

[1,2,3,4].forEach(i=>{const img=new Image();img.src=`cutin_${i}.png`});
resetGame();

</script>
